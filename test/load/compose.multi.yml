# 게이트웨이를 여러 대 띄우는 겹침.
#
# **서비스를 새로 안 만든다.** 같은 정의를 두 벌 적으면 한쪽만 고치는 날이 오고,
# 그때 두 게이트웨이가 다른 설정으로 도는데 배너는 같다고 찍는다. 포트만 범위로
# 열어 `--scale gateway=N` 으로 늘린다.
#
# **쏠림 겹침(`compose.skew.yml`)과 따로 둔다.** 저쪽은 뒷단 셋을 밖으로 여는
# 라우팅 전용이라, 뒷단 하나짜리 기본 스택에 얹으면 없는 서비스를 가리킨다.
services:
  gateway:
    ports: !override
      - "18080-18089:8080"
