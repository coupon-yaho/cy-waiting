spring:
  application:
    name: waiting

  cloud:
    circuitbreaker:
      # **라이브러리가 끼워 넣는 기본 격벽을 끈다.** 안 적으면 서킷마다 세마포어
      # 격벽이 기본 크기 25 로 붙어, 노드당 뒷단 동시 호출이 25 로 잘린다. 그
      # 거절은 서킷 안이라 실패로 세어져 뒷단이 멀쩡한데 서킷이 열렸다. 자체
      # 격벽(판정 필터의 초당 예산 × 물린 초)이 같은 일을 서킷 밖에서 이미 한다.
      bulkhead:
        resilience4j:
          enabled: false
      resilience4j:
        # **타임아웃을 여기서 켜지 않는다.** 안 끄면 라이브러리가 아무도 정하지
        # 않은 1초를 건다. 그 값은 뒷단이 정상 처리한 발급을 중간에 끊을 수 있고,
        # 입장 토큰은 소모되지 않으므로 같은 사람이 다시 발급받는다 — 초과 발급이다.
        #
        # 뒷단 요청 타임아웃은 6.2 에서 멱등 키와 함께 정한다 (CY-614).
        disable-time-limiter: true

  lifecycle:
    # 드레인 상한. **기본값과 같지만 적어 둔다** — 종료 예산을 계산하려면 이
    # 값이 보여야 하고, 기본값에 기대면 프레임워크가 바꿀 때 조용히 어긋난다.
    #
    # 종료 예산 = lb-removal-wait(6s) + 이 값(30s) = 36s.
    # **오케스트레이터의 유예(terminationGracePeriodSeconds)가 이보다 커야 한다.**
    # 작으면 드레인 도중에 강제 종료되어 진행 중인 요청이 끊긴다 — 기본값 30s
    # 그대로 두면 그 일이 매 배포마다 난다.
    timeout-per-shutdown-phase: 30s

  data:
    redis:
      host: localhost
      port: 6379
      # 스케줄러 틱(1s)보다 짧아야 한다. 명령 하나가 틱을 넘겨 붙들면
      # 그 틱의 배분이 통째로 밀린다.
      timeout: 500ms
      # 리더 리스(2s)보다 짧아야 한다. 연결에 그보다 오래 걸리면
      # 그 사이 리더십을 잃는다.
      connect-timeout: 1s
      # 풀을 켜지 않는다. Lettuce 는 커넥션 하나를 멀티플렉싱하므로
      # 풀을 얹어도 처리량은 안 늘고 커넥션 수만 예측 불가가 된다.
      # commons-pool2 를 의존성에 넣지 않는 것이 실제 강제다.

waiting:
  # **라우팅은 기본이 꺼짐이다.** 켜면 게이트웨이가 인스턴스를 직접 고른다.
  # 값을 여기 적는 것은 상한 사다리를 배포 파일 한 곳에서 보기 위해서다 —
  # 코드의 기본값으로만 두면 서로의 관계를 검증할 자리가 없다.
  routing:
    # 연속으로 이만큼 실패한 인스턴스를 후보에서 뺀다.
    outlier-failures: 3
    # **응답 상한(12초)보다 길어야 한다.** 멎은 대로 간 요청은 그 상한이 지나야
    # 실패로 관측되는데, 배제가 먼저 풀리면 직전 실패가 세어지기도 전에 그 대가
    # 후보로 돌아온다.
    outlier-eject-for: 15s
    # 되돌아온 대가 제 몫을 다 받기까지 걸리는 시간. **0 으로 두면 복귀가
    # 절벽이 된다** — 트래픽이 0 이던 대가 가장 한가해 보여 전량을 받는다.
    cold-start-ramp: 60s
  backend:
    # 가용량 기반 분배는 Phase 9 다. 여기서는 하나만 본다.
    uri: http://localhost:8090
    # **응답을 여기까지만 기다린다.** 안 정하면 무한이고, 무한이면 멎은 뒷단에
    # 걸린 요청이 격벽 자리를 영영 쥔다. 끊는 자리가 서킷 안쪽이라 이 상한이
    # 곧 서킷의 실패 표본이 된다 — 밖에서 끊으면 취소라 창에 안 쌓인다.
    #
    # **이 값은 뒷단이 이미 처리한 발급을 끊을 수 있다.** 그래서 이 경로는
    # 멱등키를 반드시 싣는다 (C-11). 실측 전이라 값 자체의 근거는 얇다 (6.7).
    response-timeout: 12s
    # **연결은 훨씬 짧게 끊는다.** 안 정하면 프레임워크 기본값 30초가 서고,
    # 죽은 인스턴스의 주소로 보낸 연결은 거절도 안 와 그동안 요청이 매달린다.
    # 연결이 실패하지 않으면 연결 실패에 무는 재시도가 걸릴 자리도 없다 —
    # 실측에서 한 대를 죽이자 64 건 중 36 건이 응답 없이 끝났다.
    #
    # **하한은 왕복 시간이 아니라 SYN 재전송 간격이다.** 같은 데이터센터의 왕복은
    # 밀리초지만, 연결 상한이 걸리는 순간은 정상일 때가 아니다. 뒷단의 accept 큐가
    # 넘치면 커널이 SYN 을 조용히 버리고, 리눅스의 첫 재전송은 1초 뒤다. 그보다
    # 짧게 잡으면 첫 재전송이 나가기도 전에 포기해 **멀쩡한 인스턴스를 실패로
    # 접는다** — accept 큐가 넘치는 순간이 하필 서킷이 닫히며 억눌린 것이 풀리는
    # 회복 구간이라, 회복이 2차 장애가 된다.
    #
    # **위로도 좁다.** 재시도가 서킷 안쪽이라(FilterOrder) 죽은 대를 먼저 고른
    # 요청은 `연결 상한 + 정상 응답` 으로 **성공**하는데, 그것이 서킷의 느림
    # 임계(1500ms)를 넘으면 느린 호출로 집계된다 — 모든 요청이 200 으로 끝나는데
    # 절반이 느림으로 세어져 서킷이 열리고, 그러면 판정이 한산한 쿠폰까지 줄로
    # 보낸다 — 한산한 쿠폰은 줄 없이 지나가야 한다. 재시도 두 번이 격벽이 막기
    # 시작하는 지연(3초)도 넘으면 안 된다.
    #
    # 1.2초로 잡는다. 첫 재전송 뒤로 여유가 있고, 살아난 재시도가 1.5초라 느림
    # 임계(1.9초) 아래이며, 시도 둘과 응답을 더해도 격벽 시한 안이다. 이 관계들은
    # BackendTimeoutBudgetTest 가 배포 파일에서 읽어 붙든다.
    #
    # **못 푸는 조합이 하나 남는다.** 시도 둘이 2.4초인데 격벽이 막기 시작하는
    # 지연은 튜너블이고 하한이 2초다. 그 하한 근처로 낮추면 재시도로 살아날
    # 요청이 서킷에 닿기 전에 격벽에서 잘리고, 잘린 것은 창에 안 쌓인다 —
    # 멎은 뒷단의 서킷이 그만큼 늦게 열린다. 값으로는 못 푼다: 연결 상한이 1초를
    # 넘어야 하고 두 번 시도하면 2초를 넘기 때문이다. 기본값(3초)에서는 성립하니
    # 그 값을 하한 근처로 내릴 때는 재시도까지 같이 봐야 한다.
    connect-timeout: 1200ms
    # **실측 전에는 맞는 값을 모른다.** 코드에 박으면 재조정마다 배포가 필요하고,
    # 배포가 필요하면 장애 중에는 못 고친다 — 정작 고쳐야 할 때가 그때다.
    # 근거는 BackendCircuitProperties 의 각 필드에 적혀 있다.
    circuit:
      # 건수가 아니라 시간이다. 100K RPS 에서 건수 100 은 수 ms 분량이다.
      sliding-window-size: 10s
      # 표본이 적을 때 열면 오픈 직후 첫 몇 건으로 전 노드가 동시에 연다.
      minimum-number-of-calls: 20
      # 백분율이다. 0.5 로 적으면 0% 로 반올림돼 첫 실패에 열린다.
      failure-rate-threshold: 50
      # 이보다 오래 걸리면 느린 호출로 센다. 타임아웃만 보면 타임아웃 직전까지
      # 느려진 인스턴스가 전부 성공으로 집계된다.
      #
      # **살아난 재시도의 값을 여기 넘기지 않는다.** 재시도가 서킷 안쪽이라
      # (FilterOrder), 안 붙는 대를 먼저 고른 요청은 `연결 대기 + 정상 응답` 으로
      # 성공한다. 그 합이 이 값을 넘으면 모든 요청이 정상인데 절반이 느림으로
      # 세어져 서킷이 열리고, 그때 판정이 한산한 쿠폰까지 줄로 보낸다.
      #
      # 그래서 1500ms 에서 올렸다. 위로는 격벽이 막기 시작하는 지연이 상한인데,
      # 그 값은 튜너블이고 하한이 2초다 — 느림 임계는 그 하한 아래여야 한다.
      slow-call-duration-threshold: 1900ms
      slow-call-rate-threshold: 50
      # 열린 뒤 이만큼 지나면 프로브를 받는다. **짧을수록 회복 시도가 잦아진다** —
      # G8.12(시도 2회 이하)를 만족시키는 것은 이 값이 아니라 판정 쪽의 유입
      # 억제다 — 서킷이 열린 동안 판정이 유입을 줄인다. 그게 붙기 전에는
      # 진동이 그대로 난다.
      wait-duration-in-open-state: 5s
      # 회복을 판정할 표본 수다. 유입 억제는 판정 쪽이 유효 credit 으로 따로 한다.
      permitted-number-of-calls-in-half-open-state: 10
      # **무제한으로 두지 않는다.** 라이브러리 기본값 0 은 무제한이라, 프로브가
      # 응답 없는 뒷단에 매달리면 서킷이 반쯤 열린 채 고정된다 — 나갈 조건이 없다.
      max-wait-duration-in-half-open-state: 30s

  # **조회는 판정이 안 막는다.** 오픈 순간 사용자는 큐에 서기 전에 쿠폰 페이지를
  # 먼저 열고, 그 100K 가 뒷단에 그대로 꽂힌다. 그리고 인스턴스가 조회로
  # 포화되면 낮은 가용량을 보고해서 발급 유입까지 같이 조여진다.
  sold-out-cache:
    # **안전판이지 정상 경로가 아니다.** 정상 해제는 재입고를 본 순간이고,
    # 이 값은 그 신호를 놓쳤을 때만 쓰인다. 낡음 한계(5초)의 여러 배로 잡되,
    # 길수록 잘못 든 관찰이 오래 산다.
    ttl: 30s
    # 키가 클라이언트 입력에서 온다. 쿠폰 키 상한과 같은 값이다.
    max-keys: 10000
  coalescing:
    # 통째로 끄는 스위치. 장애 중에 배포 없이 되돌릴 수단이다.
    enabled: true
    # 넘는 응답은 담지도 나눠 주지도 않는다. 보호 장치가 메모리 사고의 원인이
    # 되면 안 된다.
    max-body-bytes: 262144
    # **바이트로 막는다.** 키 수로만 막으면 유계가 아니다 — 키 1만 × 본문 256KiB
    # 는 2.4GiB 라, 메모리를 지키겠다고 만든 상한이 그대로 OOM 의 근거가 된다.
    # 64MiB 는 컨테이너 힙에서 떼어 줄 만한 몫이고, 실측으로 다시 정한다.
    max-cache-bytes: 67108864
    # 동시에 모을 수 있는 키 수. 이쪽은 본문을 안 들고 있어 가볍다.
    max-keys: 10000
    # **여기 적은 경로만 모은다.** 기본이 켜짐이면 개인화된 응답이 붙는 순간
    # 남의 응답을 받는다.
    routes:
      # 재고 신선도는 문제가 안 된다 — 판정이 이미 최대 1.5초 낡은 재료를 쓰므로
      # 수백 ms 는 그보다 훨씬 신선하다.
      - path: /api/v1/coupons
        ttl: 300ms

  token:
    # **기본값을 안 둔다.** 두면 아무도 안 넣은 채로 운영에 나가고, 그때
    # 서명은 공개된 값으로 찍힌다 — 서명이 있다는 사실만 남고 뜻은 사라진다.
    secret: ${WAITING_TOKEN_SECRET:}
  proxy:
    # **비면 아무 헤더도 안 믿는다.** 앞단이 전달 헤더를 덮어쓴다는 보장이
    # 있을 때만 채운다 — 아니면 클라이언트가 매 요청 다른 값을 넣어 상한을 넘는다.
    cidrs: ${WAITING_TRUSTED_PROXIES:}
  shutdown:
    # **앞단 부하 분산기 설정과 짝입니다.** readiness 를 내려도 앞단이 알아채기
    # 전까지는 계속 보내므로, 그 시간만큼 기다린 뒤에 드레인을 시작합니다.
    # 기다리지 않으면 그 사이 도착한 요청이 커넥션째 끊깁니다.
    #
    # 앞단 체크가 2초 간격에 2회 실패로 제외하므로 4초, 여기에 여유 2초입니다.
    # 한쪽만 바꾸면 어긋납니다.
    #
    # **이 대기는 spring.lifecycle.timeout-per-shutdown-phase 밖입니다.** 그 상한은
    # 종료 이벤트를 다 돌린 뒤의 단계별 정지에만 걸리므로 여기를 못 끊습니다.
    # 그래서 코드가 30s 를 상한으로 못 박습니다 (DrainWait.MAX_WAIT).
    lb-removal-wait: 6s
    # 진행 중인 요청이 빠지기를 기다리는 상한.
    #
    # **컨테이너의 단계별 상한과 같은 값입니다.** 그보다 크면 우리가 기다리는
    # 동안 컨테이너가 먼저 끊고, 작으면 아직 빠질 수 있는 요청을 두고 "상한
    # 초과" 라고 적습니다 — 어느 쪽이든 로그가 사실과 어긋납니다.
    drain-limit: 30s
  cors:
    # 와일드카드를 안 쓴다. 열어 두면 이 목록이 있다는 사실이 무의미해진다.
    allowed:
      - http://localhost:5173

server:
  port: 8080
  # 종료 신호를 받으면 진행 중인 요청만 마친다. 즉시 끊으면 부하 분산기가
  # 아직 보내는 동안 도착한 요청이 커넥션째 끊긴다.
  shutdown: graceful

management:
  # **관리 포트는 안 잠근다. 잠글 수 없다.** 여기를 루프백에만 묶으면 수집기가
  # 다른 파드에서 못 긁어 지표가 통째로 사라진다. 인증을 붙이면 프로브가
  # 못 지나간다. 그래서 이 포트의 경계는 애플리케이션 설정이 아니라 배포다 —
  # 서비스에 8081 을 싣지 않고, 수집기 네임스페이스만 오게 NetworkPolicy 를
  # 건다. 그때까지 이 포트는 클러스터 안에서 누구나 읽는다고 보아야 한다.
  # 그래서 위험한 것은 애초에 안 싣는다 (include 는 health,prometheus 뿐이고
  # 루트 상세는 never 다).
  #
  # 어느 애플리케이션이 낸 값인지 붙인다. 스무 대가 같은 값을 달고 나가므로
  # **노드를 가르지 않는다** — 노드별 구분은 수집기가 붙이는 instance 라벨이
  # 한다. 여기에 노드를 넣을 값을 적지 않는다 (LG-4).
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    # **의존성 기여자를 아예 끈다.** 그룹에서 빼는 것만으로는 루트가 여전히
    # 합산하고, 프로브 경로를 루트로 적은 배포 설정 한 줄이면 레디스 흔들림이
    # 전 노드 이탈이 된다. 꺼 두면 그룹에 넣는 실수도 기동에서 잡힌다.
    redis:
      enabled: false
  # 관리 엔드포인트를 서비스 포트로 열지 않는다. 부하 분산기는 관리 포트로
  # 확인하고 서비스 포트로 보낸다 — 한 포트로 묶으면 밖에서 진단 정보와
  # 종료 조작이 닿는다.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        # **지표도 연다.** 세기만 하고 내보낼 자리가 없으면 아무도 못 본다 —
        # 그때 대시보드는 비어 있고, 사고 중에야 그 사실을 안다.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # **의존성 상태를 넣지 않는다.** 레디스가 흔들릴 때 전 노드가 한꺼번에
      # 빠지면 그게 100% 장애다. 낡은 재료로 판정하는 것보다 훨씬 나쁘다.
      group:
        readiness:
          # readinessState 를 같이 둔다. 그룹을 직접 정의하면 프레임워크가 넣어
          # 주던 것이 빠지고, 종료 신호가 받는 판정에 안 닿는다.
          include: judging,readinessState
          show-details: always
        liveness:
          include: loopAlive
          show-details: always
      # **루트에는 안 싣는다.** 자동으로 올라오는 확인들이 레디스 주소와 배포
      # 경로를 담는데, 관리 포트는 인증이 없어 클러스터 안에서 누구나 읽는다.
      show-details: never

---
# **관측 스택에 넘길 로그를 파일로 남깁니다.**
#
# 기본은 표준 출력뿐입니다 — 컨테이너에서는 그것이 맞습니다. 로컬에서 Promtail
# 이 읽으려면 파일이 있어야 하고, 그것을 기본으로 켜면 배포 환경에서 아무도
# 지우지 않는 파일이 쌓입니다. 그래서 프로필로 가릅니다.
spring:
  config:
    activate:
      on-profile: observability
logging:
  file:
    name: build/logs/waiting.log
