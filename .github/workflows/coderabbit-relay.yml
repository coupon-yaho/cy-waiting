name: CodeRabbit Relay

# CodeRabbit 리뷰 결과를 Slack 과 Jira 로 중계한다.
#
# 주의: pull_request_review 는 **기본 브랜치의 워크플로 파일**로 실행된다.
# 이 파일을 고쳐도 main 에 병합되기 전까지는 반영되지 않는다.

# **코멘트 트리거를 쓰지 않는다.** 코멘트 하나마다 실행이 생기는데, 한 PR 에서
# 60회가 돌았고 그중 22회는 봇이 아닌 사람의 코멘트가 띄운 것이라 아무 일도
# 하지 않고 끝났다. 요약은 코멘트가 아니라 **리뷰 본문**에 실린다.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  relay:
    # CodeRabbit 이 남긴 것만. skip-review 가 붙었으면 중계하지 않는다.
    #
    # **판단을 체크아웃 앞에 둔다.** 리뷰 봇은 인라인 지적 묶음마다 리뷰를
    # 하나씩 남기는데, 요약이 없는 것까지 잡을 이유가 없다. 여기서 걸러야
    # 저장소를 받아오지도 않고 끝난다.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      (
        contains(github.event.review.body, 'Actionable comments posted') ||
        contains(github.event.review.body, 'Walkthrough') ||
        github.event.review.state == 'changes_requested' ||
        github.event.review.state == 'approved'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # **워크플로 수준에 두지 않는다.** 그쪽은 `if` 보다 먼저 평가되므로,
    # 걸러질 실행(사람 리뷰·요약 없는 리뷰)이 **진행 중인 진짜 중계를 취소**한다.
    # 취소는 이미 나간 Slack·Jira 전송을 되돌리지도 못해 중간 상태만 남는다.
    #
    # 그룹에 리뷰 ID 를 넣어 **같은 리뷰의 재실행만** 겹치게 한다. 서로 다른
    # 리뷰는 각각 중계돼야 한다 — 뒤엣것이 앞엣것을 지우면 지적이 사라진다.
    concurrency:
      group: coderabbit-${{ github.event.pull_request.number }}-${{ github.event.review.id }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: 이슈 키 추출
        id: parse
        env:
          BODY: ${{ github.event.review.body }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          STATE: ${{ github.event.review.state }}
        run: |
          set -uo pipefail

          # **요약을 담은 리뷰에만 반응한다.** 이전 조건의 `review` 는 거의 모든
          # 본문에 들어 있어 사실상 필터가 아니었다 — 리뷰 16건 중 3건만 요약이다.
          # 승인·변경요청은 본문이 없어도 결론이라 함께 중계한다.
          if ! grep -qiE 'actionable comments posted|walkthrough' <<<"$BODY" \
             && [[ "$STATE" != "changes_requested" && "$STATE" != "approved" ]]; then
            echo "relay=false" >> "$GITHUB_OUTPUT"
            echo "::notice::요약이 아닌 리뷰 — 건너뛴다"
            exit 0
          fi
          echo "relay=true" >> "$GITHUB_OUTPUT"

          # "Actionable comments posted: N" 에서 지적 수를 뽑는다
          count=$(grep -oiE 'actionable comments posted:[[:space:]]*[0-9]+' <<<"$BODY" \
                  | grep -oE '[0-9]+' | head -1 || true)
          count=${count:-0}
          echo "count=$count" >> "$GITHUB_OUTPUT"

          case "$STATE" in
            changes_requested) status=warning; verdict="변경 요청" ;;
            approved)          status=success; verdict="승인" ;;
            *) if (( count > 0 )); then status=warning; verdict="지적 ${count}건"
               else status=success; verdict="지적 없음"; fi ;;
          esac
          echo "status=$status"   >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          # 본문은 Slack 에서 읽을 만큼만 자른다
          excerpt=$(printf '%s' "$BODY" | sed -E 's/<[^>]*>//g' | head -c 600 | tr '\n' ' ')
          {
            echo "excerpt<<EOF"
            echo "$excerpt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 키 추출은 인라인으로. 외부 액션은 API 를 부르는 곳에서만 쓴다.
      - name: 이슈 키 추출
        id: jira
        if: steps.parse.outputs.relay == 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          key=$(grep -oE '(^|[^A-Za-z0-9_])CY-[0-9]+' <<<"$TITLE" | grep -oE 'CY-[0-9]+' | head -1 || true)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - if: steps.parse.outputs.relay == 'true'
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ steps.parse.outputs.status }}
          title: >-
            CodeRabbit — ${{ steps.parse.outputs.verdict }}
            (PR #${{ github.event.pull_request.number }})
          text: |
            *${{ github.event.pull_request.title }}*
            ${{ steps.parse.outputs.excerpt }}
          fields: |
            지적=${{ steps.parse.outputs.count }}건
            Jira=${{ steps.jira.outputs.key || '없음' }}
          link-url: ${{ github.event.pull_request.html_url }}
          link-text: PR 열기

      # 지적이 있을 때만. 키가 비면 부르지 않는다 — 빈 키로 부르면 실패가
      # 경고로 낮아져 조용히 사라진다.
      - if: >-
          steps.parse.outputs.relay == 'true' &&
          steps.parse.outputs.count != '0' &&
          steps.jira.outputs.key != ''
        uses: coupon-yaho/cy-ci-actions/actions/jira@c5d6391379ae34d56894538027ff3631ea4923a2  # v1
        with:
          issue-key: ${{ steps.jira.outputs.key }}
          comment: >-
            CodeRabbit 리뷰: ${{ steps.parse.outputs.verdict }} —
            [PR #${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})
          base-url: ${{ secrets.ATLASSIAN_BASE_URL }}
          email: ${{ secrets.ATLASSIAN_USER_EMAIL }}
          token: ${{ secrets.ATLASSIAN_API_TOKEN }}
