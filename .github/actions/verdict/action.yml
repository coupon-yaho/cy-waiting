name: Verdict
description: 잡 결과 목록을 하나의 통과·실패로 판정한다

# `contains(needs.*.result, 'failure')` 만 보면 취소가 통과로 집계되어
# Jira 가 다음 상태로 넘어간다. 규칙을 한 곳에 두고 세 워크플로가 같이 쓴다.
#
# **규칙은 스크립트에 둔다.** 인라인으로 두면 자기검증을 못 걸고, 실제로 그
# 사이에 "실패를 출력만 하고 잡은 성공으로 끝내는" 상태가 오래 있었다.

inputs:
  results:
    description: "join(needs.*.result, ' ') 결과"
    required: true

outputs:
  status:
    description: success | failure. **실패면 잡도 실패한다** — 그래야 병합이 막힌다
    value: ${{ steps.judge.outputs.status }}
  ok:
    description: 'true | false'
    value: ${{ steps.judge.outputs.ok }}

runs:
  using: composite
  steps:
    - name: 통과·실패 판정
      id: judge
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: "$GITHUB_ACTION_PATH/../../scripts/verdict.sh"
