name: _load-test

# k6 부하 시나리오 하나를 돈다. 시나리오 정의는 plan/06-protection.md 6.6절.
#
# PR 에서는 smoke 만 — 20,000 스파이크를 PR 마다 돌리면 아무도 PR 을 안 연다.
# 무거운 것은 main·nightly 에서.

on:
  workflow_call:
    inputs:
      scenario:
        description: smoke | idle-coupon | contended-coupon | read-burst | read-window | open-spike | mixed | abandonment | overhead | no-shared-marker
        type: string
        required: true
      timeout-minutes:
        type: number
        required: false
        default: 30
    outputs:
      passed:
        value: ${{ jobs.load.outputs.passed }}
      summary:
        value: ${{ jobs.load.outputs.summary }}

permissions:
  contents: read

jobs:
  load:
    name: k6 ${{ inputs.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}
      summary: ${{ steps.evaluate.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 시나리오와 compose 를 **둘 다** 본다. 하나만 있으면 절반쯤 돌다
      # 알아보기 어려운 오류로 죽는다.
      - name: 게이트 기준 대조
        id: probe
        env:
          # **셸에 직접 보간하지 않는다.** 이 값은 수동 실행에서 사람이 넣을 수
          # 있어서, 따옴표를 닫고 나오는 문자열이면 그대로 명령이 된다.
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -uo pipefail
          missing=()
          [[ -f "test/load/$SCENARIO.js" ]] || missing+=("test/load/$SCENARIO.js")
          [[ -f "test/load/compose.yml" ]]               || missing+=("test/load/compose.yml")

          if ((${#missing[@]} == 0)); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=부하 시험 건너뜀::없음 — ${missing[*]} (Phase 6 6.6절 미완료)"
          fi

      # **JAR 를 여기서 다시 안 만든다.** 빌드 잡이 만든 것을 받아 온다 —
      # 두 번 만들면 부하가 때리는 산출물과 검사를 통과한 산출물이 갈릴 수 있다.
      - name: 빌드 산출물 받기
        if: steps.probe.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-libs
          path: build/libs/

      # 백엔드 스텁 + Redis + 게이트웨이를 띄운다 (6.6.1).
      # setup-gradle 은 두지 않는다 — 여기서 gradlew 를 쓰지 않는다.
      - name: compose 기동 (게이트웨이 · Redis · 스텁)
        if: steps.probe.outputs.ready == 'true'
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          # **계약이 안 선 상태를 재는 판은 스텁의 선언을 끈다.** 늘 붙이면
          # 하네스가 그 상태를 한 번도 안 지나고, 그러면 "발급 계층이 안 붙이면
          # 어떻게 되는가" 를 아무도 못 본다.
          if [[ "$SCENARIO" == "no-shared-marker" ]]; then
            export SHARED_HEADER=false
          fi
          # **판을 박지 않는다.** 산출물 이름이 판을 따라가므로 박아 두면 판을
          # 올릴 때마다 여기서 컨테이너 빌드가 깨진다 — 실제로 v0.4.1 에서 그랬다.
          # `-plain` 과 `-test-fixtures` 는 실행 JAR 이 아니다. 실행 JAR 만
          # 분류자가 없다.
          jar=$(find build/libs -maxdepth 1 -name 'waiting-*.jar' \
                  ! -name '*-plain.jar' ! -name '*-test-fixtures.jar')
          if [[ $(wc -l <<<"$jar") -ne 1 || -z "$jar" ]]; then
            echo "::error::실행 JAR 을 하나로 못 짚었다: ${jar:-없음}"
            exit 1
          fi
          export WAITING_JAR="$jar"
          echo "실행 JAR — $WAITING_JAR"
          docker compose -f test/load/compose.yml up -d --wait

      - if: steps.probe.outputs.ready == 'true'
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065  # v1.2.1

      - name: k6 실행
        id: run
        if: steps.probe.outputs.ready == 'true'
        continue-on-error: true
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          # **러너가 못 띄우는 인원을 정직하게 줄인다.** 2만을 요구해 놓고 못
          # 띄우면 도착이 늘어져 스파이크가 아니라 고원을 재게 된다 — 그 값으로
          # Phase 10 착수를 판정하면 안 된다.
          if [[ "$SCENARIO" == "open-spike" ]]; then
            export SPIKE_USERS="${SPIKE_USERS:-20000}"
            # **레디스가 얼마나 바빴는지를 같이 잰다** (10.0.2). 응답만 보면
            # 게이트웨이가 빨리 답해도 레디스가 한계에 닿아 있는 판을 못 본다 —
            # Phase 10 착수를 정하는 것은 그쪽 수치다.
            test/load/redis-probe.sh redis-ops.txt &
            probe_pid=$!
          fi
          k6 run --summary-export=k6-summary.json "test/load/$SCENARIO.js"
          rc=$?
          if [[ -n "${probe_pid:-}" ]]; then
            kill "$probe_pid" 2>/dev/null || true
            # 느린 명령이 있었는지도 남긴다 (10.0.4). 판정에는 안 쓰고 기록만 한다.
            docker compose -f test/load/compose.yml exec -T redis \
                redis-cli SLOWLOG GET 25 > redis-slowlog.txt 2>&1 || true
          fi
          exit $rc

      # 게이트 판정은 k6 threshold 가 아니라 계획서 기준으로 한다 (6.6.6)
      - name: 게이트 기준 대조
        id: evaluate
        if: always()
        env:
          SCENARIO: ${{ inputs.scenario }}
          # **레디스를 직접 본다.** 응답만 보면 게이트웨이가 줄에 올려 놓고 통과
          # 응답을 내도 통과한다 — 요청 경로에서 레디스를 안 친다는 것(불변식 1)의
          # 유일한 직접 증거가 키를 보는 것이다.
          REDIS_CLI: >-
            docker compose -f test/load/compose.yml exec -T redis redis-cli
        run: |
          # **뒷단이 몇 번 받았는지를 뒷단에게 묻는다.** 게이트웨이 지표로 재면
          # 모으기가 자기 성적을 자기가 매기는 셈이다.
          if [[ "$SCENARIO" == "read-burst" || "$SCENARIO" == "read-window" \
                || "$SCENARIO" == "no-shared-marker" ]]; then
            STUB_SERVED=$(docker compose -f test/load/compose.yml exec -T backend \
                wget -qO- http://localhost:8090/stub/health 2>/dev/null \
                | sed -n 's/.*"served":\([0-9]*\).*/\1/p')
            export STUB_SERVED
          fi
          set -uo pipefail
          if [[ "${{ steps.probe.outputs.ready }}" != "true" ]]; then
            echo "passed=skipped" >> "$GITHUB_OUTPUT"
            echo "summary=시나리오 미구현" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -x test/load/evaluate-gate.sh ]]; then
            # if 안에서 실행한다 — 기본 셸이 `bash -eo pipefail` 이라
            # 그냥 부르면 미달인 순간 죽어서 판정값이 안 남는다.
            if test/load/evaluate-gate.sh "$SCENARIO" k6-summary.json \
                 | tee /tmp/gate.txt; then
              passed=true
            else
              passed=false
            fi
            echo "passed=$passed" >> "$GITHUB_OUTPUT"
            echo "summary=$(head -c 400 /tmp/gate.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "passed=${{ steps.run.outcome == 'success' }}" >> "$GITHUB_OUTPUT"
            echo "summary=k6 outcome: ${{ steps.run.outcome }}" >> "$GITHUB_OUTPUT"
          fi

      # k6 에 continue-on-error 가 걸려 있어 스텝만으로는 잡이 안 죽는다.
      # 여기서 닫지 않으면 부하가 깨져도 잡이 초록이다.
      - name: 판정 반영
        if: steps.evaluate.outputs.passed == 'false'
        run: |
          echo "::error title=부하 시험::${{ inputs.scenario }} 기준 미달 — ${{ steps.evaluate.outputs.summary }}"
          exit 1

      # **판정에 안 쓰고 기록만 한다.** 여기서 막으면 Phase 10 착수 판단이
      # 야간 잡의 통과 조건이 되는데, 그 판단은 사람이 값을 보고 하는 일이다.
      - name: 샤딩 착수 판정 기록
        if: always() && inputs.scenario == 'open-spike'
        continue-on-error: true
        run: |
          if [[ -s redis-ops.txt ]]; then
            test/load/evaluate-shard-gate.sh redis-ops.txt k6-summary.json \
                | tee /tmp/shard-gate.txt
          else
            echo "::notice title=샤딩 착수 판정::ops 표본이 없다 — 프로브가 안 돌았다"
          fi

      - name: compose 로그 수집
        if: always() && steps.probe.outputs.ready == 'true'
        run: docker compose -f test/load/compose.yml logs --tail=200 || true

      - if: always() && hashFiles('k6-summary.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: load-${{ inputs.scenario }}
          # **레디스 쪽 값도 같이 남긴다.** Phase 10 착수는 응답이 아니라 이
          # 수치가 정한다 — 나중에 다시 재려면 판이 같아야 한다.
          path: |
            k6-summary.json
            redis-ops.txt
            redis-slowlog.txt
          retention-days: 7      # 수 KB JSON. 추세는 Confluence 리포트에 남는다
