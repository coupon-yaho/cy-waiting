# 대기열 레디스. 이 설정이 지키려는 것은 **순서**이지 무결성이 아니다.
#
# 순번이 카운터가 아니라 시계라(A-9) 유실이 생겨도 중복 발번이 나지 않는다.
# 남는 위험은 대기자 증발인데, 그 사람들은 재등록하면 되고 **새 순번이 더 커서
# 이미 줄 선 사람을 추월하지 않는다.**

appendonly yes

# always 가 아니다. 20,000 스파이크에서 매 쓰기마다 fsync 를 치를 이득이
# 아니다 (E-6). 최대 1초 분량이 사라지고, 그건 위 이유로 허용한다.
appendfsync everysec

# 다시 쓰는 동안 fsync 를 멈추지 않는다. 멈추면 그 구간의 지연이 튀고,
# 튄 지연은 명령 타임아웃(500ms)을 넘겨 스케줄러를 멎게 한다.
no-appendfsync-on-rewrite no

# 메모리가 차면 조용히 지우지 않는다. 대기열 항목이 사라지면 그 사람은
# 줄에서 증발하는데, 그걸 eviction 정책으로 결정하게 두지 않는다.
maxmemory-policy noeviction

# 시계는 slew 로만 맞춘다는 운영 전제(2.4절)를 여기 적어 둔다 — 설정으로
# 강제할 수 없어서, 읽는 사람이 알게 하는 것이 최선이다.
#   chrony:  makestep 0 0
