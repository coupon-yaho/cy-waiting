name: Nightly

# 야간 전체 검증. PR·main 에서 돌리기엔 너무 비싼 것들.
#   - 20,000 동시 스파이크 (Phase 10 착수 게이트의 입력)
#   - 이탈·혼합 시나리오
#   - CVE 전체 (LOW 까지, 차단하지 않고 관측만)
#
# 실패해도 무엇이 실패했는지 전부 보여야 하므로 fail-fast 를 끈다.

on:
  schedule:
    - cron: '0 18 * * 1-5'   # UTC 18:00 = KST 03:00, 평일
  workflow_dispatch:
    inputs:
      scenario:
        description: 특정 시나리오만 실행 (비우면 전체)
        type: string
        required: false
        default: ''

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # workflow_dispatch 로 시나리오 하나만 지정할 수 있게 한다.
  # 입력을 선언만 하고 쓰지 않으면, 지정해도 조용히 전체가 돌아
  # "왜 30분이 걸리지" 를 디버깅하게 된다.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - name: 실행할 시나리오 선택
        id: pick
        env:
          ONLY: ${{ github.event.inputs.scenario }}
        run: |
          set -uo pipefail
          all='["idle-coupon","contended-coupon","read-burst","read-window","open-spike","mixed","abandonment","overhead","no-shared-marker"]'
          if [[ -n "$ONLY" ]]; then
            echo "scenarios=[\"$ONLY\"]" >> "$GITHUB_OUTPUT"
            echo "::notice::시나리오 '$ONLY' 만 실행"
          else
            echo "scenarios=$all" >> "$GITHUB_OUTPUT"
          fi

  build:
    uses: ./.github/workflows/_build.yml
    with:
      # **산출물을 올린다.** 아래 부하 잡들이 이 JAR 를 받아 이미지를 짓는다.
      # 잡 안에서 다시 만들면 부하가 때리는 것과 검사를 통과한 것이 갈린다.
      upload-artifact: true

  # 전 계층을 한 번에. fail-fast: false 라 하나가 깨져도 나머지가 끝까지 돈다.
  # continue-on-error 는 쓰지 않는다 — 잡이 success 가 되어 report 가 늘 통과로 본다.
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, integration, context, chaos, mutation]
    uses: ./.github/workflows/_test.yml
    with:
      layer: ${{ matrix.layer }}
      timeout-minutes: 60

  load:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    uses: ./.github/workflows/_load-test.yml
    with:
      scenario: ${{ matrix.scenario }}
      timeout-minutes: 45

  # **G7.5 는 시나리오 행렬에 못 넣는다.** 크레딧을 굶긴 겹침으로 스택을 띄우고
  # 실행 도중 임계를 표본해야 해서, k6 한 회차 돌리고 요약을 보는 틀과 모양이 다르다.
  # 판정 자체는 `gate-selftest.sh` 가 PR 마다 몇 초에 검증한다.
  waste:
    name: 부하 / 크레딧 낭비 (G7.5)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065  # v1.2.1
      # **JAR 를 여기서 다시 안 만든다.** Dockerfile 이 밖에서 만든 것을 받는다 —
      # 없으면 이미지가 안 지어지고 하네스가 아예 안 뜬다.
      - name: 빌드 산출물 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-libs
          path: build/libs/
      - name: 실측
        run: ./test/load/abandonment-waste.sh
      # 미달이든 미판정이든 왜 그런지는 로그에 있다. 실패한 회차에서만 필요하다.
      - name: 하네스 로그
        if: failure()
        run: docker compose -f test/load/compose.yml -f test/load/compose.waste.yml logs --tail 200

  # **R1 은 시나리오 행렬로 못 잰다.** 행렬은 한 시나리오씩 따로 돌리는데,
  # R1 은 "다른 쿠폰이 몰리는 동안에도 한산한 쿠폰은 줄 없이 지나간다" 라서
  # 둘을 **같은 시각에** 봐야 성립한다. 한산 쪽만 따로 보면 대기열을 통째로
  # 꺼도 통과하고, 경합 쪽만 따로 보면 격리를 아예 안 잰다.
  #
  # 실제로 그 상태였다 — `idle-coupon` 과 `contended-coupon` 이 행렬에서 따로
  # 돌고 있었고, 둘을 겹쳐 돌리는 스크립트는 있는데 아무도 부르지 않았다.
  isolation:
    name: 부하 / 쿠폰 격리 (R1)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065  # v1.2.1
      - name: 빌드 산출물 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-libs
          path: build/libs/
      # 스택은 스크립트가 세우지 않는다. 두 시나리오가 같은 게이트웨이를 봐야
      # 격리가 성립하므로 여기서 한 번 띄우고 스크립트는 부하만 넣는다.
      - name: 하네스 기동
        run: |
          set -uo pipefail
          # **JAR 이 있는지 먼저 본다.** 없으면 이미지가 안 지어지고 기동이
          # 알 수 없는 오류로 끝난다 — `_load-test.yml` 이 같은 이유로 이걸 본다.
          # **확인한 경로를 그대로 넘긴다.** compose 기본값과 따로 적으면 둘이
          # 갈라져도 확인이 통과한다 — 확인의 목적이 사라진다.
          jar=build/libs/waiting.jar
          if [[ ! -f "$jar" ]]; then
            echo "::error::실행 JAR 이 없다: $jar"
            exit 1
          fi
          export WAITING_JAR="$jar"
          echo "실행 JAR — $WAITING_JAR"
          docker compose -f test/load/compose.yml up -d --wait
      - name: 실측
        env:
          OUT_DIR: r1-out
        run: ./test/load/r1-isolation.sh
      # 미달이 난 아침에 손에 남는 것이 이것뿐이다. 임시 디렉터리에 두면
      # 실행이 끝나는 순간 요약이 같이 사라진다.
      - name: 실측 산출물
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: r1-isolation
          path: r1-out/
          retention-days: 7
          if-no-files-found: warn
      - name: 하네스 로그
        if: failure()
        run: docker compose -f test/load/compose.yml logs --tail 200

  security:
    uses: ./.github/workflows/_security.yml
    with:
      mode: full
      severity: 'CRITICAL,HIGH,MEDIUM,LOW'   # 스캔은 LOW 까지
      block-severity: 'CRITICAL,HIGH'        # 차단은 여기까지 — 헤더의 '관측만' 이 그 뜻이다
    permissions:
      contents: read
      security-events: write
      # 재사용 워크플로의 잡이 요구하는 권한은 호출부가 먼저 줘야 한다.
      # dependency-review 는 PR 에서만 돌지만(if), GitHub 은 if 평가보다
      # 권한 검증을 먼저 해서 안 도는 잡 때문에 워크플로 전체가 죽는다.
      pull-requests: write

  # 취소를 통과로 세지 않기 위해 별도 잡으로 뺐다. 규칙은 verdict 액션에 있다.
  #
  # **빌드와 계획도 넣는다.** 아래 셋이 다 `needs: build` 라, 빌드가 깨지면 그
  # 셋이 통째로 skipped 가 되고 `security` 만 남는다 — JAR 을 한 번도 못 만든
  # 밤에 "이상 없음" 이 나간다. 실제로 그렇게 돼 있었다.
  verdict:
    name: 판정
    needs: [plan, build, test, load, waste, isolation, security]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.v.outputs.status }}
      ok: ${{ steps.v.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: v
        uses: ./.github/actions/verdict
        with:
          results: ${{ join(needs.*.result, ' ') }}

  report:
    needs: [plan, build, test, load, waste, isolation, security, verdict]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_report.yml
    with:
      status: ${{ needs.verdict.outputs.ok == 'true' && 'success' || 'warning' }}
      title: 야간 검증 — ${{ needs.verdict.outputs.ok == 'true' && '이상 없음' || '주의 필요' }}
      summary: |
        전 계층 테스트 · 9개 부하 시나리오 · 쿠폰 격리(R1) · 크레딧 낭비(G7.5) · CVE 전체 스캔
      fields: |
        계획=${{ needs.plan.result }}
        빌드=${{ needs.build.result }}
        테스트=${{ needs.test.result }}
        부하=${{ needs.load.result }}
        쿠폰 격리 (R1)=${{ needs.isolation.result }}
        크레딧 낭비=${{ needs.waste.result }}
        보안=${{ needs.security.result }}
      link-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      confluence-title: 야간 검증 리포트
      confluence-body: |
        <p>최근 실행: <code>${{ github.sha }}</code></p>
        <table>
          <tr><th>항목</th><th>결과</th></tr>
          <tr><td>계획</td><td>${{ needs.plan.result }}</td></tr>
          <tr><td>빌드</td><td>${{ needs.build.result }}</td></tr>
          <tr><td>테스트 (전 계층)</td><td>${{ needs.test.result }}</td></tr>
          <tr><td>부하 (9 시나리오)</td><td>${{ needs.load.result }}</td></tr>
          <tr><td>쿠폰 격리 (R1)</td><td>${{ needs.isolation.result }}</td></tr>
          <tr><td>크레딧 낭비 (G7.5)</td><td>${{ needs.waste.result }}</td></tr>
          <tr><td>보안 (LOW 포함)</td><td>${{ needs.security.result }}</td></tr>
        </table>
        <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">상세</a></p>
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ATLASSIAN_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
      ATLASSIAN_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
      CONFLUENCE_PARENT_ID: ${{ secrets.CONFLUENCE_PARENT_ID }}
