# 데몬과 시험 JVM 에 힙 상한을 건다.
#
# **안 걸면 JVM 마다 램의 1/4 을 잡는다.** 이 빌드는 데몬 하나에 시험 JVM 넷
# (unit·integration·context·chaos), 거기에 뮤테이션 미니언과 테스트컨테이너가
# 붙는다. 상한이 없으면 그 전부가 각자 몇 기가씩 잡을 수 있는 상태가 된다.
#
# 실측으로 정한 값이다. 이 저장소의 시험은 가장 무거운 계층도 512m 를 안 넘는다.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m

# **작업 병렬 실행을 안 켠다.** 시험 계층들이 공유 레디스와 도커를 만져서,
# 동시에 돌면 서로의 상태를 밟는다 — 그건 메모리보다 먼저 신뢰를 깬다.
org.gradle.parallel=false

# 안 쓰는 데몬을 오래 남기지 않는다. 기본은 3시간이라 어제 것이 그대로 떠 있다.
org.gradle.daemon.idletimeout=1800000
