# 기준선 LB. **경유 회차의 LB 와 같은 프록시 경로를 탄다** — 뒤에 게이트웨이 대신 정적 응답만 내는 origin 을 둔다.
#
# LB 가 스스로 응답하면 upstream 연결·keepalive·버퍼링 비용이 기준선에 없어, 빼고 나면 그 몫이 게이트웨이
# 오버헤드로 넘어간다. 그래서 워커·연결·upstream 설정을 `gateway.conf` 와 줄 단위로 맞춘다.
#
# 워커 수는 compose 의 코어 한도(2)와 같다. auto 는 호스트 코어를 세어 한도보다 많은 워커가 코어를 다툰다.
worker_processes 2;
# **파일 한도를 연결 수만큼 올린다.** 기본 1024 면 VU 가 2,400 인 칸에서 accept 가 실패하고, 못 받은 연결의 요청이
# 회차 끝까지 걸려 유입률이 절반으로 찍혔다.
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_requests 1000000;

    upstream backends {
        server origin:8071 max_fails=0;
        keepalive 512;
    }

    server {
        listen 8070;

        location = /lb/health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream off;
        }
    }
}
