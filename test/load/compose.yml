# 부하 시나리오가 때릴 대상. 게이트웨이 · Redis · 뒷단 스텁.
#
# **전부 healthcheck 를 단다.** 없으면 `up --wait` 가 곧바로 돌아오고, 게이트웨이가
# 뜨기 전에 k6 가 때려서 실패가 코드 결함인지 기동 경합인지 안 갈린다.

services:
  redis:
    image: redis:7.4-alpine
    volumes:
      - ../../docker/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 20

  # 지연과 동시 한도를 다르게 줘 인스턴스별 용량 차등을 만든다 (Phase 9).
  # 스모크는 하나만 쓴다 — 여럿이 필요한 시나리오가 나중에 붙는다.
  backend:
    build: ./backend-stub
    environment:
      PORT: "8090"
      LATENCY_MS: "5"
      MAX_INFLIGHT: "200"
      # **계약을 안 지키는 뒷단도 재야 한다.** 늘 붙이면 하네스가 그 상태를 한
      # 번도 안 지나고, 그러면 "발급 계층이 안 붙이면 어떻게 되는가" 를 아무도
      # 못 본다. 기본은 붙임 — 기존 게이트가 그 상태를 잰다.
      SHARED_HEADER: "${SHARED_HEADER:-true}"
      # 0 이면 안 한다. 켜면 헤더는 곧바로 주고 본문을 끝없이 흘린다 —
      # 응답 상한이 못 잡는 뒷단을 만들어 총 시간 상한을 재는 자리다.
      SLOW_BODY_MS: "${SLOW_BODY_MS:-0}"
    ports:
      # **오버헤드 대조군이 여기를 직접 친다.** 게이트웨이를 지난 값과 같은
      # 판에서 빼야 k6 자신의 비용과 루프백 왕복이 상쇄된다.
      - "18090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/stub/health"]
      interval: 1s
      timeout: 2s
      retries: 20

  # **재료를 심는다.** 활성 쿠폰과 재고가 없으면 스냅샷이 영영 비고, 모든 요청이
  # 미지 쿠폰 경로로 빠져 판정 필터를 통째로 우회한다 — 그 상태로 잰 초록은
  # 판정을 안 지난 초록이다.
  #
  # 가용량 보고는 뒷단이 자기 상태를 적는 것이라 주기적으로 갱신해야 한다.
  # 신선도 임계를 넘기면 하한으로 떨어져 대기열이 통째로 켜진다.
  seeder:
    image: redis:7.4-alpine
    depends_on:
      redis: { condition: service_healthy }
    command:
      - sh
      - -c
      - |
        set -eu
        redis-cli -h redis SADD coupons:active c1
        redis-cli -h redis SET 'stock:{c1}' 1000000
        # **대조군 쿠폰.** 같은 하네스에서 줄이 실제로 서는 것까지 봐야
        # "한산할 때만 안 선다" 가 성립한다 (6.7.2). 하나만 두면 대기열을
        # 통째로 꺼도 R1 시나리오가 통과한다.
        redis-cli -h redis SADD coupons:active c2
        redis-cli -h redis SET 'stock:{c2}' 1000000
        # **매진 쿠폰.** 게이트웨이만 만들 수 있는 응답이 하나 있어야
        # "이 판에 게이트웨이가 있었다" 를 시나리오가 증명할 수 있다.
        # 스텁은 어떤 URL 에도 성공을 돌려주므로 통과 응답으로는 못 한다.
        redis-cli -h redis SADD coupons:active c3
        redis-cli -h redis SET 'stock:{c3}' 0
        while :; do
          redis-cli -h redis HSET capacity:coupon-svc:v1 stub-1 \
            "{\"addr\":\"backend:8090\",\"credits\":300,\"ts\":$(date +%s)}" > /dev/null
          sleep 1
        done
    healthcheck:
      # **셋을 다 본다.** 하나만 보면 나머지가 아직 없는데 준비됐다고 말한다.
      test:
        - CMD
        - sh
        - -c
        - |
          [ "$$(redis-cli -h redis SISMEMBER coupons:active c1)" = 1 ] &&
          [ "$$(redis-cli -h redis SISMEMBER coupons:active c2)" = 1 ] &&
          [ "$$(redis-cli -h redis SISMEMBER coupons:active c3)" = 1 ] &&
          [ "$$(redis-cli -h redis EXISTS 'stock:{c1}')" = 1 ] &&
          [ "$$(redis-cli -h redis EXISTS 'stock:{c2}')" = 1 ] &&
          [ "$$(redis-cli -h redis EXISTS 'stock:{c3}')" = 1 ] &&
          [ "$$(redis-cli -h redis HEXISTS capacity:coupon-svc:v1 stub-1)" = 1 ]
      interval: 1s
      timeout: 2s
      retries: 20

  # **예열을 기다린다.** 가용량 보고가 들어와도 램프가 끝나기 전에는 크레딧이
  # 0 에 가깝고, 그러면 한산 통과 상한이 0 이라 모든 발급이 큐로 간다. 그 상태에
  # 부하를 넣으면 판정을 재는 게 아니라 램프를 재는 셈이다.
  warmup:
    image: redis:7.4-alpine
    depends_on:
      gateway: { condition: service_healthy }
    command: ["sh", "-c", "sleep infinity"]
    healthcheck:
      # **가장 굶주린 시나리오가 필요한 값까지 기다린다.** 상한이 1 이상이면
      # 된다고 두면, 초당 100 을 넣는 판이 상한 14 인 상태에서 시작한다. 첫
      # 초에 큐가 켜지고 그 뒤로는 사다리 8번이 판을 통째로 가져간다 —
      # 게이트웨이 오버헤드를 잰다고 적고 큐 등록 경로를 재게 된다.
      test:
        - CMD
        - sh
        - -c
        - "[ \"$$(redis-cli -h redis HGET gw:snapshot '#credit')\" -ge 200 ]"
      interval: 2s
      timeout: 3s
      # 램프는 60초짜리다. 재시도 예산이 그보다 짧으면 판이 아니라 기동이 진다.
      retries: 90

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # 실행 JAR 이름을 정확히 짚는다. 여럿과 맞으면 무엇이 들어갈지
        # 순서에 달린다. 판이 바뀌면 여기 한 줄만 고친다.
        JAR: build/libs/waiting-0.3.0.jar
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
      seeder: { condition: service_healthy }
    environment:
      SPRING_DATA_REDIS_HOST: redis
      WAITING_BACKEND_URI: http://backend:8090
      WAITING_CORS_ALLOWED_0: http://localhost:5173
      # 하네스용 값. 운영 키는 배포에서 온다 — 여기 든 값은 시험 부하에만 쓴다.
      WAITING_TOKEN_SECRET: load-harness-not-a-real-secret-0123456789
      # **앞단을 믿게 한다.** 안 넣으면 전달 헤더를 통째로 무시하고 도커 브리지
      # 주소 하나로 전부 센다 — 시나리오가 VU 마다 다른 주소를 붙여도 아무 소용이
      # 없고, 한 시나리오의 부하가 다른 시나리오의 주소 몫을 먹는다. 그러면
      # 격리를 재려던 시험이 하네스의 모양을 잰다.
      WAITING_PROXY_CIDRS_0: 172.16.0.0/12
      WAITING_PROXY_CIDRS_1: 10.0.0.0/8
      WAITING_PROXY_CIDRS_2: 192.168.0.0/16
    ports:
      # 시나리오가 이 주소를 쓴다. 관리 포트는 안 연다 — 밖에서 닿으면 안 된다.
      - "18080:8080"
    healthcheck:
      # **받는 것으로 본다.** 살아 있음만 보면 재료가 없는 노드에 부하를 넣게 되고,
      # 그러면 판정을 우회한 결과를 게이트로 쓴다. 재료는 시더가 먼저 심는다.
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 2s
      timeout: 3s
      retries: 30
