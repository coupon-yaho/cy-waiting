name: _verify-conventions

# 규범이 실제로 지켜지는지 검사한다. ai/rules/ 의 MUST 중 기계적으로 판정 가능한 것.
# 코드가 없어도 항상 돈다 — 규범은 Phase 1 이전부터 적용된다.

on:
  workflow_call:
    inputs:
      check-commits:
        description: PR 커밋 메시지 규약을 검사할 것인가
        type: boolean
        required: false
        default: true
      require-journal:
        description: 코드 변경 시 journal 엔트리를 요구할 것인가
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  hooks:
    name: 훅·문서 규범 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # 자기검증이 브랜치 리뷰 러너를 돌린다. 얕은 체크아웃이면 기준
          # 브랜치가 없어 그 케이스를 건너뛰고, 건너뛴 검사는 없는 것과 같다.
          fetch-depth: 0
      # 로케일 프로브가 쓸 로케일을 만들어 둔다. 러너 이미지에 en_US.UTF-8 이
      # 항상 있다는 보장이 없고, 없으면 자기검증이 그 프로브를 실패로 낸다 —
      # 조용히 건너뛰는 것보다 낫지만 여기서 미리 깔아 두는 것이 맞다.
      - name: 로케일 준비
        run: |
          sudo locale-gen en_US.UTF-8
          sudo update-locale
          locale -a | grep -i 'en_us'

      # 훅이 위반을 잡지 못하면 모든 코드를 통과시킨다 (TS-9)
      - name: 훅 자기검증
        run: |
          chmod +x .claude/hooks/*.sh
          .claude/hooks/self-test.sh

      # 심판이 헐거우면 하네스가 무엇을 재든 초록이다. 실제로 게이트웨이를 안
      # 띄운 판과 표본 0 건인 판이 통과한 적이 있다 (TS-9).
      - name: 부하 게이트 자기검증
        run: |
          chmod +x test/load/*.sh
          test/load/gate-selftest.sh

      # 리포트가 "4개 시나리오" 라고 적은 채 여덟 개를 돌고 있었다. 사본이
      # 생기면 갈라지고, 갈라진 쪽을 보는 사람은 안 돈 것을 돌았다고 읽는다.
      - name: nightly 시나리오 수가 리포트와 맞는가
        run: |
          python3 - <<'EOF'
          import json, pathlib, re, sys
          t = pathlib.Path('.github/workflows/nightly.yml').read_text()
          n = len(json.loads(re.search(r"all='(\[[^\]]*\])'", t).group(1)))
          bad = [m for m in re.findall(r'부하 \((\d+) 시나리오\)|(\d+)개 부하 시나리오', t)
                 for m in m if m and int(m) != n]
          for m in bad:
              print(f'::error title=시나리오 수 불일치::리포트는 {m}, 목록은 {n}')
          sys.exit(1 if bad else 0)
          EOF

      # 존재하지 않는 태스크를 가리키는 게이트는 판정할 수 없다. ID 가 겹치면
      # 두 작업이 한 번호를 쓴다. 번호를 바꿀 때 조용히 깨진다.
      - name: 게이트·태스크 ID 중복
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          bad = 0
          for f in sorted(pathlib.Path('plan').glob('[01][0-9]-*.md')):
              t = f.read_text()
              for label, pat in (('태스크', r'^\|\s*\*{0,2}(\d+\.\d+\.\d+)\*{0,2}\s*\|'),
                                 ('게이트', r'^\|\s*\*{0,2}(G\d+\.\d+)\*{0,2}\s*\|')):
                  ids = re.findall(pat, t, re.M)
                  for d in sorted({i for i in ids if ids.count(i) > 1}):
                      print(f'::error title={label} ID 중복::{f.name} {d}')
                      bad += 1
          sys.exit(1 if bad else 0)
          EOF

      - name: 게이트가 가리키는 태스크가 실재하는가
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          GATE = re.compile(r'^\|\s*\*{0,2}(G\d+\.\d+)\*{0,2}\s*\|.*\|\s*([^|]+?)\s*\|\s*$', re.M)
          bad = 0
          docs = sorted(pathlib.Path('plan').glob('[01][0-9]-*.md'))
          allt = set()
          for f in docs:
              t = f.read_text()
              allt |= set(re.findall(r'^\|\s*\*{0,2}(\d+\.\d+\.\d+)\*{0,2}\s*\|', t, re.M))
              allt |= set(re.findall(r'^####\s+\*{0,2}T(\d+\.\d+\.\d+)', t, re.M))
          for f in docs:
              for m in GATE.finditer(f.read_text()):
                  for ref in re.findall(r'\b\d+\.\d+\.\d+\b', m.group(2)):
                      if ref not in allt:
                          print(f'::error title=끊긴 게이트 참조::{f.name} {m.group(1)} -> {ref}')
                          bad += 1
          sys.exit(1 if bad else 0)
          EOF

      # 문서의 커밋 예시가 훅을 통과하지 못하면 규칙과 강제가 갈라진 것이다.
      # 지키지 못할 예시를 보고 따라 쓰면 훅에 막힌다.
      - name: 문서의 커밋 예시가 훅을 통과하는가
        run: |
          set -uo pipefail
          fail=0
          while read -r subject; do
            [[ -z "$subject" ]] && continue
            jq -nc --arg c "git commit -m '$subject'" '{tool_input:{command:$c}}' \
              | .claude/hooks/check-commit-msg.sh >/dev/null 2>&1 && continue
            echo "::error title=커밋 예시 위반::$subject"
            fail=1
          done < <(grep -rhoE '(feat|fix|test|refactor|perf|docs|build|ci|chore)(\([a-z0-9-]+\))?: [^"`|$.]+' \
                     ai/rules/60-workflow.md .claude/hooks/check-commit-msg.sh \
                     .claude/commands/ plan/ CLAUDE.md \
                   | sed 's/ *\[red\]//; s/ *(선택)//; s/ *$//' | sort -u)
          exit $fail

      # 작업 로그 형식. **색인 동기화는 안 본다** — 색인이 생성물이라
      # 저장소에 없다 (CY-303). 원래 지키려던 것은 "프론트매터가 유효한가"
      # 였고, 색인 등록 검사는 손으로 유지하던 사본을 붙잡던 장치였다.
      - name: 작업 로그 형식
        run: .github/scripts/journal-index.sh --check

      # 색인을 잡 요약에 찍는다. 저장소에 파일이 없으니 여기가 목록을 보는
      # 자리다. 실패해도 파이프라인을 막지 않는다 — 판정이 아니라 가시성이다.
      - name: 작업 로그 색인
        if: always()
        continue-on-error: true
        run: .github/scripts/journal-index.sh >> "$GITHUB_STEP_SUMMARY"

  pr-conventions:
    name: PR 규약
    # 커밋 규약과 작업 로그는 같은 것을 본다 — PR 의 커밋 목록과 변경 파일.
    # 잡을 나누면 전 이력 클론을 두 번 한다.
    if: >-
      github.event_name == 'pull_request' &&
      (inputs.check-commits || inputs.require-journal)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 커밋 메시지 규약
        # 봇 PR 은 제외한다 — 한글 제목도 Jira 푸터도 봇이 쓸 수 있는 것이 아니다.
        # 작업 로그 검사와 같은 기준을 쓴다. 기준이 둘이면 언젠가 갈라진다.
        if: >-
          inputs.check-commits &&
          !endsWith(github.event.pull_request.user.login, '[bot]')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # **규칙을 여기 옮겨 적지 않는다.** 훅이 쓰는 것과 사본이 생기면 둘이
          # 갈라지고, 그때부터 손으로 커밋한 것과 CI 가 다른 판단을 한다.
          # shellcheck source=.githooks/lib/commit-subject-rules.sh
          source .githooks/lib/commit-subject-rules.sh
          fail=0

          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%b "$sha")

            # 병합 커밋은 규약 대상이 아니다. 부모 수로만 알 수 있어 여기서 본다.
            [[ $(git rev-list --parents -n1 "$sha" | wc -w) -gt 2 ]] && continue

            # **봇이 쓴 커밋도 제외한다.** 위의 PR 작성자 조건은 봇이 연 PR 만
            # 걸러, 사람이 연 PR 안에 섞여 들어온 범프 커밋은 그대로 검사한다.
            # 릴리스 PR 처럼 여러 병합을 한꺼번에 담는 자리에서는 반드시 섞인다 —
            # 그러면 봇에게 한글 제목과 Jira 푸터를 요구하는 셈이 된다.
            author=$(git log -1 --format=%ae "$sha")
            [[ "$author" == *"[bot]"* ]] && continue

            if ! violations=$(check_commit_subject "$subject"); then
              echo "::error::[$sha] $subject"
              while IFS= read -r line; do
                [[ -n "$line" ]] && echo "::error::  $line"
              done <<<"$violations"
              fail=1
            fi

            # **본문 규칙이라 제목 예외를 안 받는다.** 도구가 지은 제목이어도
            # 본문에 마커가 있으면 그건 사람이 넣은 것이다.
            if grep -q '\[red\]' <<<"$body" && ! grep -qE '^test' <<<"$subject"; then
              echo "::error::[$sha] [red] 마커는 test: 커밋에만: $subject"; fail=1
            fi
          done < <(git rev-list "$BASE..$HEAD")

          exit $fail

      - name: 작업 로그
        # 봇 PR 은 제외한다 — 의존성 범프에 근거 문서를 요구할 수는 없다
        if: >-
          inputs.require-journal &&
          !endsWith(github.event.pull_request.user.login, '[bot]')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          changed=$(git diff --name-only "$BASE..$HEAD")

          # 근거를 남겨야 하는 변경:
          #   - src/ · *.lua · 빌드 스크립트  (동작을 바꾼다)
          #   - .github/workflows · .github/actions  (파이프라인 동작을 바꾼다)
          # 제외: 문서, 규칙, 계획, PR 템플릿 — 그 자체가 근거 문서다
          # 제외 목록은 .claude/hooks/remind-journal.sh 와 같아야 한다.
          # 어긋나면 훅은 조용한데 CI 가 PR 을 막는다.
          # `|| true` 가 없으면 **문서만 바꾼 PR 이 조용히 죽는다.** 전부 걸러지면
          # grep 이 1 을 내고, 러너 기본 셸의 -e 가 메시지도 없이 잡을 실패시킨다.
          # 훅(remind-journal.sh)은 -e 가 없어 같은 파이프라인이 멀쩡하다.
          code=$(grep -vE '^(plan|ai|\.claude)/' <<<"$changed" \
               | grep -vE '^\.github/(README\.md|CODEOWNERS|PULL_REQUEST_TEMPLATE\.md|ISSUE_TEMPLATE/)' \
               | grep -vE '\.md$' \
               | grep -vE '^\.git(ignore|attributes)$' | head -1 || true)

          if [[ -z "$code" ]]; then
            echo "::notice::근거 문서가 필요한 변경이 없어 건너뛴다"; exit 0
          fi
          if grep -qE '^ai/journal/' <<<"$changed"; then
            echo "::notice::작업 로그 확인됨"
          else
            echo "::error title=WF-6::동작을 바꿨는데 ai/journal/ 엔트리가 없다 (예: $code)"
            echo "::error::ai/journal/TEMPLATE.md 를 복사한다. '왜'와 '고려했으나 택하지 않은 것'을 비우지 말 것"
            exit 1
          fi

  links:
    name: 문서 링크
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # CI 와 로컬이 **같은 스크립트**를 쓴다. 인라인으로 두면 로컬에서 못
      # 돌리고, 못 돌리면 파일을 지우고 링크를 안 고친 PR 이 여기서야 걸린다.
      - name: 문서 링크 검사
        run: .github/scripts/doc-links.sh

      # **사람이 리뷰로 막을 수 없다.** 라벨 하나 추가는 한 줄이고, 그 한 줄이
      # 무엇을 뜻하는지는 운영에서 인덱스가 죽고 나서야 드러난다 (LG-4).
      - name: Loki 라벨 검사
        run: .github/scripts/loki-labels.sh

      # **없는 지표를 보는 패널은 영원히 빈 화면이다.** 대시보드를 열어 보기
      # 전까지 아무도 모르고, 지표 이름을 바꾸면 특히 그렇다 (LG-11).
      - name: 대시보드 지표 검사
        run: .github/scripts/dashboard-queries.sh

      # **문법이 깨진 규칙 파일은 조용히 건너뛰어진다.** 알람이 하나도 안 걸린
      # 채로 초록이고, 그 사실은 장애가 나서 아무도 안 불릴 때 드러난다 (6.9.5).
      - name: promtool 설치
        run: |
          set -euo pipefail
          ver=3.1.0
          url="https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/prom.tgz
          tar -xzf /tmp/prom.tgz -C /tmp
          sudo install "/tmp/prometheus-${ver}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: 알람 규칙 검사
        run: .github/scripts/alert-rules.sh

      # **핀 옆 주석이 거짓말하면 핀이 무의미하다.** 실제로 `download-artifact` 는
      # 주석이 `v7.0.0` 인데 `v6.0.0` 을 핀하고 있었고, `gradle/actions` 는 커밋이
      # 아니라 태그 객체를 핀했다. 리뷰어는 주석을 믿고 넘어간다.
      - name: 액션 핀 검사
        run: .github/scripts/action-pins.sh

      - name: 문서 앵커 검사
        run: .github/scripts/doc-anchors.sh

      # **재시도가 무엇을 삼키는지는 정규식 한 줄에 걸려 있다.** 그 줄은 넓히기
      # 쉽고, 넓히는 순간 시험 실패가 재시도로 덮인다 (TS-7·TS-9).
      - name: 재시도 자기검증
        run: .github/scripts/gradle-retry-selftest.sh
