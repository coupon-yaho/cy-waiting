name: _test

# 테스트 계층 하나를 돈다. 계층별로 잡을 나누는 이유는
# 실패했을 때 **어느 계층이 깨졌는지가 이름만 보고 드러나야** 하기 때문이다.
# (ai/rules/40-testing.md TS-5)

on:
  workflow_call:
    inputs:
      layer:
        description: unit | integration | context | chaos | mutation | coverage
        type: string
        required: true
      timeout-minutes:
        type: number
        required: false
        default: 20
    outputs:
      result:
        value: ${{ jobs.test.outputs.result }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.layer }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-gradle

      - name: 테스트 실행
        id: run
        if: steps.setup.outputs.buildable == 'true'
        run: |
          set -euo pipefail
          case "${{ inputs.layer }}" in
            unit)        .github/scripts/gradle-retry.sh test ;;
            integration) .github/scripts/gradle-retry.sh integrationTest ;;
            context)     .github/scripts/gradle-retry.sh contextTest ;;
            chaos)       .github/scripts/gradle-retry.sh chaosTest ;;
            # **비율이 무엇 위에서 나온 값인지 검사한다.** 판정 못 한 뮤턴트가
            # 있는 채로 남은 것만 세면, 게이트가 초록인데 무엇을 지켰는지 말할
            # 수 없다. 요약이 말한 수와 리포트에 기록된 수를 맞춰 본다.
            mutation)
              # **그레이들이 죽어도 검사를 먼저 돈다.** 유실로 임계가 미달해
              # 실패하는 경우가 정확히 우리가 짚어야 할 케이스인데, 여기서 같이
              # 죽으면 일반 그레이들 실패만 남는다.
              rc=0
              mkdir -p build   # 첫 실행이면 아직 없다. tee 가 먼저 죽는다
              # **재시도 스크립트를 안 쓴다.** 이 단계는 로그를 스스로 모아
              # 아래 검사에 넘기는데, 재시도가 로그를 덮어쓰면 마지막 실행만 남아
              # 앞 실행의 유실을 못 본다. 뮤테이션은 나이틀리라 재실행이 싸다.
              ./gradlew --no-daemon pitest 2>&1 | tee build/pitest.log || rc=$?
              # **그레이들의 종료 코드를 잃지 않는다.** 여기서 그냥 exit 1 하면
              # OOM 킬(137)이 1 로 뭉개져, 왜 빨간지 로그를 다 읽어야 안다.
              die() {
                echo "::error::$1"
                if [ "$rc" -ne 0 ]; then exit "$rc"; fi
                exit 1
              }
              # **파이프라인에 || true 를 붙인다.** pipefail 아래에서 grep 이
              # 0건이면 대입 자체가 실패해 set -e 가 그 자리에서 셸을 죽인다.
              # 그러면 아래 안내가 한 줄도 안 나온다 — 로그 형식이 바뀌었을 때
              # 정확히 그 사실을 말해야 하는 자리인데 침묵하게 된다.
              generated=$(grep -oE 'Generated [0-9]+ mutations' build/pitest.log \
                            | grep -oE '[0-9]+' | tail -1 || true)
              if [ -z "$generated" ]; then
                die "PIT 요약 줄이 없다 — 로그 형식이 바뀌었거나 로그가 비었다"
              fi
              report=build/reports/pitest/mutations.xml
              if [ ! -f "$report" ]; then
                die "뮤턴트 리포트가 없다 — 경로가 바뀌었는지 본다"
              fi
              # **여기가 유실을 잡는 자리다.** 미니언이 죽는 것 자체는 유실이
              # 아니다. PIT 는 시간을 넘긴 뮤턴트를 TIMED_OUT 으로 기록하고 그것을
              # 죽인 것으로 센다 — 실측으로 두 수가 정확히 맞았다. 정말로 잃는
              # 경우는 판정이 안 붙은 채 끝나는 것이고, 그건 아래가 잡는다.
              counted=$(grep -c '<mutation ' "$report" || true)
              if [ "$generated" != "$counted" ]; then
                die "뮤턴트 ${generated}개를 만들었는데 ${counted}개만 기록됐다"
              fi
              # **상태를 읽었는지부터 확인한다.** 따옴표나 속성 이름이 바뀌면
              # 아래 검사가 0건을 내는데, 그 0 은 "판정이 다 붙었다" 가 아니라
              # "아무것도 못 읽었다" 다. 둘을 구분 못 하면 이 검사가 조용히
              # 사라진다 — 이 잡이 없애려던 병의 다른 얼굴이다.
              #
              # grep -c 에 -o 를 같이 주지 않는다. GNU 는 줄을, 다른 구현은
              # 매치를 세어 같은 명령이 러너와 로컬에서 다른 값을 낸다.
              parsed=$(grep -oE "status='[A-Z_]+'" "$report" | wc -l | tr -d ' ' || true)
              if [ "$parsed" != "$counted" ]; then
                die "status 속성을 못 읽었다 — 리포트 형식이 바뀌었다"
              fi
              unresolved=$(grep -oE \
                "status='(RUN_ERROR|MEMORY_ERROR|NOT_STARTED|STARTED)'" "$report" \
                | wc -l | tr -d ' ' || true)
              # **못 셌으면 실패한다.** 빈 값으로 두면 [ "" -gt 0 ] 이 오류를
              # 내면서도 거짓으로 떨어져 가드가 통과한다. 방향이 반대다.
              case "$unresolved" in
                ''|*[!0-9]*) die "판정 상태를 셀 수 없었다 — 리포트를 못 읽었다" ;;
              esac
              if [ "$unresolved" -gt 0 ]; then
                die "판정이 안 붙은 뮤턴트가 ${unresolved}개다 — 비율이 근거를 잃었다"
              fi
              # **비율은 우리가 잰다.** PIT 의 임계는 정수 백분율로 비교해
              # 반올림한다 — 89.9% 가 90 으로 올라가 통과한다. 문서가 든
              # "생존 ≤ 10%" 는 그 반올림 아래에서 참이 아니다. 정수 산술로
              # 다시 문다: 죽인 수 × 10 이 전체 × 9 보다 작으면 미달이다.
              killed=$(grep -oE "status='(KILLED|TIMED_OUT)'" "$report" \
                | wc -l | tr -d ' ' || true)
              case "$killed" in
                ''|*[!0-9]*) die "죽인 뮤턴트를 셀 수 없었다 — 리포트를 못 읽었다" ;;
              esac
              if [ $((killed * 10)) -lt $((counted * 9)) ]; then
                die "죽인 뮤턴트가 ${counted}개 중 ${killed}개다 — 생존이 10% 를 넘었다"
              fi
              [ "$rc" -eq 0 ] || exit "$rc"
              ;;
            # 어댑터는 단위·통합 양쪽에서, 게이트웨이는 단위·컨텍스트 양쪽에서
            # 덮인다. 계층이 잡으로 갈려 exec 가 한자리에 안 모이므로 여기서
            # 셋을 함께 돌려 합쳐 잰다 — 빠뜨리면 임계가 안 도는데 잰 것으로
            # 기록된다. jacocoTestCoverageVerification 은 도메인 100% 다.
            coverage)    .github/scripts/gradle-retry.sh test integrationTest contextTest \
                           jacocoTestCoverageVerification \
                           adapterCoverageVerification gatewayCoverageVerification ;;
            *) echo "::error::알 수 없는 계층 '${{ inputs.layer }}'"; exit 1 ;;
          esac

      # 실패해도 리포트는 올린다 — 로그만으로는 어느 단언이 깨졌는지 찾기 어렵다
      - if: always() && steps.setup.outputs.buildable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: report-${{ inputs.layer }}
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/pitest/
            build/pitest.log
          retention-days: 2      # 무료 한도. 실패는 당일에 본다
          if-no-files-found: ignore

      - name: 잡 요약 기록
        if: always() && steps.setup.outputs.buildable == 'true'
        run: |
          echo "### 테스트 — ${{ inputs.layer }}" >> "$GITHUB_STEP_SUMMARY"
          echo "결과: \`${{ steps.run.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
