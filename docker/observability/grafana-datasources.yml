# 대시보드가 볼 곳. 손으로 등록하면 다음 사람이 빈 화면을 본다.
apiVersion: 1

datasources:
  # **uid 를 박는다.** 없으면 그라파나가 등록할 때마다 새로 만들고, 패널이
  # 이름이 아니라 uid 로 데이터소스를 찾으므로 재생성 뒤에 빈 화면이 된다.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
