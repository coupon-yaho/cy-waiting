name: _test

# 테스트 계층 하나를 돈다. 계층별로 잡을 나누는 이유는
# 실패했을 때 **어느 계층이 깨졌는지가 이름만 보고 드러나야** 하기 때문이다.
# (ai/rules/40-testing.md TS-5)

on:
  workflow_call:
    inputs:
      layer:
        description: unit | integration | context | chaos | mutation
        type: string
        required: true
      timeout-minutes:
        type: number
        required: false
        default: 20
    outputs:
      result:
        value: ${{ jobs.test.outputs.result }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.layer }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-gradle

      - name: 테스트 실행
        id: run
        if: steps.setup.outputs.buildable == 'true'
        run: |
          set -euo pipefail
          case "${{ inputs.layer }}" in
            unit)        ./gradlew --no-daemon test ;;
            integration) ./gradlew --no-daemon integrationTest ;;
            context)     ./gradlew --no-daemon contextTest ;;
            chaos)       ./gradlew --no-daemon chaosTest ;;
            mutation)    ./gradlew --no-daemon pitest ;;
            *) echo "::error::알 수 없는 계층 '${{ inputs.layer }}'"; exit 1 ;;
          esac

      # 실패해도 리포트는 올린다 — 로그만으로는 어느 단언이 깨졌는지 찾기 어렵다
      - if: always() && steps.setup.outputs.buildable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ inputs.layer }}
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/pitest/
          retention-days: 2      # 무료 한도. 실패는 당일에 본다
          if-no-files-found: ignore

      - name: 잡 요약 기록
        if: always() && steps.setup.outputs.buildable == 'true'
        run: |
          echo "### 테스트 — ${{ inputs.layer }}" >> "$GITHUB_STEP_SUMMARY"
          echo "결과: \`${{ steps.run.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
