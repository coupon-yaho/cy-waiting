name: Slack Notify
description: Block Kit 메시지를 Slack 웹훅으로 보낸다

inputs:
  webhook:
    description: Incoming Webhook URL. 비어 있으면 조용히 건너뛴다
    required: true
  status:
    description: success | failure | warning | info
    required: false
    default: info
  title:
    required: true
  text:
    description: 본문 (mrkdwn)
    required: false
    default: ''
  fields:
    description: '"라벨=값" 을 줄바꿈으로 나열. 최대 10개'
    required: false
    default: ''
  link-url:
    required: false
    default: ''
  link-text:
    required: false
    default: '열기'

runs:
  using: composite
  steps:
    - name: Slack Block Kit 전송
      shell: bash
      env:
        HOOK: ${{ inputs.webhook }}
        STATUS: ${{ inputs.status }}
        TITLE: ${{ inputs.title }}
        TEXT: ${{ inputs.text }}
        FIELDS: ${{ inputs.fields }}
        URL: ${{ inputs.link-url }}
        LINK_TEXT: ${{ inputs.link-text }}
      run: |
        set -uo pipefail

        if [[ -z "$HOOK" ]]; then
          echo "::warning title=Slack::웹훅이 없어 건너뛴다 (.github/README.md 참조)"
          exit 0
        fi

        case "$STATUS" in
          success) icon="✅" ;;
          failure) icon="🔴" ;;
          warning) icon="🟡" ;;
          *)       icon="ℹ️" ;;
        esac

        blocks=$(jq -nc --arg h "$icon $TITLE" \
          '[{type:"header", text:{type:"plain_text", text:$h, emoji:true}}]')

        if [[ -n "$TEXT" ]]; then
          blocks=$(jq -c --arg t "$TEXT" \
            '. + [{type:"section", text:{type:"mrkdwn", text:$t}}]' <<<"$blocks")
        fi

        # **슬랙은 한 섹션에 필드 10 개까지다.** 잘라 내면 마지막 결과가
        # 조용히 사라진다 — 그게 하필 실패한 검사면 아무도 못 본다.
        # 열한 번째부터는 섹션을 하나 더 만든다.
        if [[ -n "$FIELDS" ]]; then
          all=$(printf '%s\n' "$FIELDS" | grep -v '^[[:space:]]*$' \
              | jq -Rc '{type:"mrkdwn", text:("*" + (split("=")[0]) + "*\n" + (split("=")[1:] | join("=")))}' \
              | jq -sc .)
          n=$(jq 'length' <<<"$all")
          for ((i = 0; i < n; i += 10)); do
            f=$(jq -c --argjson i "$i" '.[$i:($i + 10)]' <<<"$all")
            blocks=$(jq -c --argjson f "$f" '. + [{type:"section", fields:$f}]' <<<"$blocks")
          done
        fi

        if [[ -n "$URL" ]]; then
          blocks=$(jq -c --arg u "$URL" --arg lt "$LINK_TEXT" \
            '. + [{type:"actions", elements:[{type:"button", text:{type:"plain_text", text:$lt}, url:$u}]}]' <<<"$blocks")
        fi

        payload=$(jq -nc --arg t "$icon $TITLE" --argjson b "$blocks" '{text:$t, blocks:$b}')

        code=$(curl -sS -o /tmp/slack.txt -w '%{http_code}' \
          -H 'Content-Type: application/json' -X POST "$HOOK" -d "$payload")

        if [[ "$code" =~ ^2 ]]; then
          echo "::notice title=Slack::전송 완료"
        else
          # 알림 실패가 빌드를 깨뜨리지 않게 한다 — 알림은 부수 효과다
          echo "::warning title=Slack::전송 실패 (HTTP $code): $(head -c 200 /tmp/slack.txt)"
        fi
