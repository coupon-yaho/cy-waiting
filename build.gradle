plugins {
    id 'java'
    id 'jacoco'
    // 도메인 한정. 어댑터까지 돌리면 시간이 폭발하고, 정작 지켜야 할 곳의
    // 신호가 묻힌다 (Phase 2 Goal — 생존 ≤ 10%)
    id 'info.solidsoft.pitest' version '1.15.0'
    // 픽스처를 src/test 에 두면 다른 소스셋에서 못 쓰고,
    // 프로덕션에 두면 도달 불가 상태를 만드는 생성자가 운영 코드에 노출된다 (TS-3).
    id 'java-test-fixtures'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kafkick'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springCloudVersion = '2025.1.2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// 해당 페이즈에 도달하기 전에는 넣지 않는다.
// Redis·resilience4j·loadbalancer 를 미리 넣으면 쓰지 않는 의존성이 빌드를 무겁게 하고,
// 어느 페이즈가 무엇을 요구하는지가 흐려진다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 도메인 순수성은 리뷰로 못 지킨다. 한 번 깨지면 조용히 번진다.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── 테스트 계층 ──────────────────────────────────────────────────────────────
// CI 가 계층별로 나눠 돌린다 (_test.yml). 한 태스크에 다 넣으면 어느 계층이
// 왜 느린지·왜 깨졌는지가 안 보이고, 페이즈별로 켜고 끌 수도 없다.
//
// 태그로 가른다. 태그가 없는 테스트는 unit 으로 본다 — 새 테스트를 쓰면서
// 태그를 잊어도 어딘가에서는 돈다.

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'context', 'chaos'
    }
    finalizedBy jacocoTestReport
}

['integration', 'context', 'chaos'].each { layer ->
    tasks.register("${layer}Test", Test) {
        description = "${layer} 계층 테스트"
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags layer
        }
        // 해당 태그가 하나도 없어도 실패하지 않는다. 계층은 페이즈가
        // 진행되며 채워지고, 빈 계층 때문에 파이프라인이 막히면 안 된다.
        filter {
            failOnNoMatchingTests = false
        }
    }
}

// ── 품질 임계 ────────────────────────────────────────────────────────────────
// 임계 미달이면 build 가 실패한다. "확인했다" 는 통과가 아니다.

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // 픽스처는 커버리지 대상이 아니다. 테스트를 돕는 코드라
    // 포함시키면 본 코드의 미달을 픽스처가 덮는다.
    classDirectories.setFrom(sourceSets.main.output)
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn test
    classDirectories.setFrom(sourceSets.main.output)
    violationRules {
        // 도메인은 순수해서 100% 가 가능하다. 못 채운다는 것은
        // 도달 불가 분기가 있다는 뜻이고, 그건 설계 문제다.
        rule {
            element = 'PACKAGE'
            includes = ['com.kafkick.waiting.domain.*']
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// 픽스처가 프로덕션 아티팩트에 새면 도달 불가 상태를 만드는 생성자가
// 운영 코드에 노출된다 (TS-3). 사람 눈으로 보지 않고 빌드가 잡는다.
tasks.register('verifyFixturesExcluded') {
    dependsOn tasks.named('bootJar')
    doLast {
        def jar = tasks.named('bootJar').get().archiveFile.get().asFile
        def leaked = new java.util.zip.ZipFile(jar).entries().toList()
                .findAll { it.name.contains('testFixtures') || it.name.endsWith('Fixtures.class') }
        if (leaked) {
            throw new GradleException("픽스처가 프로덕션 JAR 에 포함됐다: ${leaked*.name}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyFixturesExcluded'
}

pitest {
    targetClasses = ['com.kafkick.waiting.domain.*']
    // domain 은 Phase 2 에서 채워진다. 그전까지 대상이 0건인데, 이걸 실패로
    // 두면 파이프라인이 페이즈 진행을 막는다. 클래스가 들어오면 임계가 문다.
    failWhenNoMutations = false
    excludedClasses = ['com.kafkick.waiting.*Application*']
    mutationThreshold = 90          // 생존 ≤ 10%
    timestampedReports = false
    junit5PluginVersion = '1.2.1'
}
