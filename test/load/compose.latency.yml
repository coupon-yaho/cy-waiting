# 명령별 지연 계기를 켠다.
#
# **등록 왕복이 반 초인데 레디스가 한가했다.** 착수 판정 회차에서 20k 스파이크의 등록
# p99 가 520ms 였고 같은 회차의 레디스 봉우리 CPU 는 41% 였다. 등록 타이머는 부른
# 시점부터 결과까지라 클라이언트 대기가 섞여 있어, 그 반 초가 어디인지 이 값만으로는
# 못 가른다. 레디스를 쪼개서 줄일 수 있는 몫인지가 여기서 갈린다.
#
# 켜면 Lettuce 가 왕복마다 `lettuce.command.firstresponse` 와 `lettuce.command.completion`
# 을 낸다. 첫 응답은 채널에 쓴 시점부터 우리 이벤트 루프가 디코드를 시작할 때까지라 레디스
# 실행과 양쪽 대기가 같이 든다. 둘의 차는 디코드 시간뿐이라 거의 0 이다 — 읽을 값은 그것이
# 아니라 **등록 타이머에서 첫 응답을 뺀 값**이고, 그것이 쓰기 전의 우리 몫이다.
#
#   사용: docker compose -f compose.yml -f compose.pinned.yml -f compose.latency.yml up -d
#
# **겹침으로 둔다.** 기본은 꺼짐이고 기존 회차의 조건을 안 바꾼다 — 지금까지 잰 값들과
# 견주려면 그쪽은 그대로여야 한다.
#
# **이 계기 자체가 비용이다.** 실측으로 등록 한 건에 기록이 1.02 회 돈다 — Lua 안의 호출은
# 클라이언트 명령이 아니라 안 센다. 부풀지는 않지만 공짜도 아니므로, 이 회차의 처리량을
# 다른 회차의 천장과 나란히 적을 때는 계기가 켜져 있었다는 것을 같이 적는다.
services:
  gateway:
    environment:
      WAITING_REDIS_COMMANDLATENCY_ENABLED: "true"
