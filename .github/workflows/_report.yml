name: _report

# 결과를 바깥으로 내보낸다 — Slack 알림 · Jira 상태 전이 · Confluence 리포트.
#
# 세 가지를 한 잡에 둔 이유: 같은 입력(결과 요약)을 쓰고, 셋 중 하나가 실패해도
# 나머지는 보내야 한다. 알림 실패가 빌드를 깨뜨리면 안 된다.

on:
  workflow_call:
    inputs:
      status:
        description: success | failure | warning
        type: string
        required: true
      title:
        type: string
        required: true
      summary:
        description: 본문 (mrkdwn)
        type: string
        required: false
        default: ''
      fields:
        description: '"라벨=값" 줄바꿈 목록'
        type: string
        required: false
        default: ''
      link-url:
        type: string
        required: false
        default: ''
      jira-key:
        type: string
        required: false
        default: ''
      jira-transition:
        type: string
        required: false
        default: ''
      jira-comment:
        type: string
        required: false
        default: ''
      confluence-title:
        description: 비우면 Confluence 리포트를 만들지 않는다
        type: string
        required: false
        default: ''
      confluence-body:
        description: storage 형식 HTML
        type: string
        required: false
        default: ''
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
      ATLASSIAN_BASE_URL:
        required: false
      ATLASSIAN_USER_EMAIL:
        required: false
      ATLASSIAN_API_TOKEN:
        required: false
      CONFLUENCE_SPACE_KEY:
        required: false
      CONFLUENCE_PARENT_ID:
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `steps.*.if` 에서는 `secrets` 컨텍스트를 읽을 수 없다. 잡 레벨 env 로 옮겨
    # 존재 여부만 노출한다 — 값은 안 쓰고 비었는지만 본다.
    env:
      HAS_CONFLUENCE: ${{ secrets.CONFLUENCE_SPACE_KEY != '' && secrets.ATLASSIAN_BASE_URL != '' }}
      HAS_JIRA: ${{ secrets.ATLASSIAN_BASE_URL != '' && secrets.ATLASSIAN_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Confluence 를 먼저 만든다 — Slack 메시지에 그 링크를 넣기 위해서다
      # 시크릿이 없으면 부르지 않는다. confluence 액션은 **필수 입력이 비면
      # fail-on-error 와 무관하게 하드 실패**하므로, 빈 space-key 로 부르면
      # "알림 실패가 빌드를 깨뜨리지 않는다" 는 전제가 무너진다.
      - id: confluence
        if: inputs.confluence-title != '' && env.HAS_CONFLUENCE == 'true'
        uses: coupon-yaho/cy-ci-actions/actions/confluence@v1
        with:
          space-key: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          parent-id: ${{ secrets.CONFLUENCE_PARENT_ID }}
          title: ${{ inputs.confluence-title }}
          body: ${{ inputs.confluence-body }}
          labels: ci
          base-url: ${{ secrets.ATLASSIAN_BASE_URL }}
          email: ${{ secrets.ATLASSIAN_USER_EMAIL }}
          token: ${{ secrets.ATLASSIAN_API_TOKEN }}

      - if: always() && inputs.jira-key != '' && env.HAS_JIRA == 'true'
        uses: coupon-yaho/cy-ci-actions/actions/jira@v1
        with:
          issue-key: ${{ inputs.jira-key }}
          comment: ${{ inputs.jira-comment }}
          transition: ${{ inputs.jira-transition }}
          link-url: ${{ inputs.link-url }}
          link-title: ${{ inputs.title }}
          base-url: ${{ secrets.ATLASSIAN_BASE_URL }}
          email: ${{ secrets.ATLASSIAN_USER_EMAIL }}
          token: ${{ secrets.ATLASSIAN_API_TOKEN }}

      - if: always()
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ inputs.status }}
          title: ${{ inputs.title }}
          text: ${{ inputs.summary }}
          fields: ${{ inputs.fields }}
          link-url: ${{ steps.confluence.outputs.url || inputs.link-url }}
          link-text: ${{ steps.confluence.outputs.url && '리포트' || '워크플로' }}
