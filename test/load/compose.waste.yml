# G7.5 실측용 겹침. **크레딧을 굶긴다.**
#
# 낭비를 재려면 줄이 생존 신호 수명(250초)보다 깊어야 한다. 기본 구성은 초당
# 300 이라 천 명이 서너 초에 빠져, 이탈자가 걷히기 한참 전에 임계가 지나간다 —
# 그 회차에서 잰 낭비율은 스위퍼가 아니라 크레딧 크기를 재는 값이다.
services:
  seeder:
    command:
      - sh
      - -c
      - |
        set -eu
        redis-cli -h redis SADD coupons:active c2
        redis-cli -h redis SET 'stock:{c2}' 1000000
        while :; do
          redis-cli -h redis HSET capacity:coupon-svc:v1 stub-1 \
            "{\"addr\":\"backend:8090\",\"credits\":${CREDITS:-3},\"ts\":$(date +%s)}" > /dev/null
          sleep 1
        done
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - |
          [ "$$(redis-cli -h redis SISMEMBER coupons:active c2)" = 1 ] &&
          [ "$$(redis-cli -h redis EXISTS 'stock:{c2}')" = 1 ] &&
          [ "$$(redis-cli -h redis HEXISTS capacity:coupon-svc:v1 stub-1)" = 1 ]

  # **예열 기준을 낮춘다.** 기본 구성은 크레딧 200 을 기다리는데 여기서는 3 이
  # 목표라 영원히 안 뜬다.
  warmup:
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "[ \"$$(redis-cli -h redis HGET gw:snapshot '#credit')\" -ge 1 ]"
