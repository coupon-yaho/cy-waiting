name: PR

# PR 을 열거나 갱신할 때. **빠른 피드백**이 목적이다.
# 무거운 것(뮤테이션·카오스·대형 부하)은 main·nightly 로 미룬다.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다.
# 취소하지 않으면 러너가 낡은 커밋을 검사하느라 큐가 막힌다.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1단계: 무엇이 바뀌었나 · 어느 Jira 이슈인가 ────────────────────────────
  context:
    name: 컨텍스트
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jira-key: ${{ steps.jira.outputs.key }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # PR 의 첫 관문이라 외부 액션에 의존하지 않는다 — 그 저장소가 깨지면
      # 모든 PR 이 여기서 막힌다.
      - name: 코드 변경 감지
        id: jira
        env:
          BRANCH: ${{ github.head_ref }}
          IS_BOT: ${{ endsWith(github.event.pull_request.user.login, '[bot]') }}
        run: |
          set -uo pipefail
          # **봇은 이 형식을 만들 수 없다.** 브랜치명과 티켓 번호는 사람이 지킬
          # 규칙이고, 그걸 봇에게 요구하면 의존성 갱신마다 빨간 체크가 쌓인다 —
          # 늘 빨간 것은 늘 초록인 것과 똑같이 아무 신호도 안 준다.
          #
          # **면제하는 것은 이 규칙 하나뿐이다.** 빌드·테스트·시크릿·의존성 검토는
          # 그대로 돈다. 의존성을 바꾸는 PR 이야말로 그것들이 가장 필요한 자리다.
          if [[ "$IS_BOT" == "true" ]]; then
            echo "::notice title=WF-3::봇 PR — 브랜치명 규칙을 건너뛴다: '$BRANCH'"
            echo "key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `integration` 은 여러 하위 작업을 묶어 한 PR 로 올리는 자리이고,
          # `chore` 는 코드가 아닌 배선을 고치는 자리다. 둘 다 WF-3 이 이름으로
          # 드러내라고 정한 형태다.
          if ! grep -qE '^(feature|bugfix|hotfix|release|integration|chore)/CY-[0-9]+-[a-z0-9-]+$' <<<"$BRANCH"; then
            echo "::error title=WF-3::브랜치명이 규칙에 맞지 않는다: '$BRANCH'"
            echo "::error::형식: <feature|bugfix|hotfix|release|integration|chore>/CY-<번호>-<영문-kebab-슬러그>"
            exit 1
          fi
          key=$(grep -oE 'CY-[0-9]+' <<<"$BRANCH" | head -1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "::notice title=Jira::$key"

      - name: 코드 변경 감지
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          changed=$(git diff --name-only "$BASE..$HEAD")
          # 빌드에 영향이 없는 것은 코드로 세지 않는다. 세면 설정 한 줄에
          # 전 테스트가 돈다. journal 검사의 제외 목록에서 출발하되, 아래
          # 예외 셋이 붙어 그쪽보다 넓다 — 같은 범위가 아니다.
          #
          # **게이트를 적은 계획서는 예외다.** 그 문서를 읽어 게이트와 시험이
          # 이어져 있는지 보는 시험이 있는데, 문서라고 건너뛰면 게이트를 지우는
          # PR 에서 정확히 그 시험이 안 돈다 — 막으려던 것을 그 PR 이 한다.
          #
          # **빌드 배선도 예외다.** 액션 판올림은 `.github/` 만 건드려서 빌드가
          # 통째로 건너뛰어졌다. 그래서 메이저 버전이 한 번도 안 돌아 본 채
          # 머지되고, 처음 실행되는 곳은 다음 사람의 코드 PR 이다 — 그 사람이
          # 남의 판올림을 디버깅한다. 빌드를 바꾸면 빌드로 검증한다.
          #
          # **`pr.yml` 자신도 넣는다.** 빌드·테스트를 부르는 배선이 여기 있어서,
          # 빼 두면 그 호출을 바꾸는 변경이 자기가 바꾼 것을 안 돌린다.
          #
          # **`actions/` 를 통째로 넣지 않는다.** 알림이나 판정 액션은 빌드가
          # 아니라 항상 도는 잡에서만 쓰인다. 넣으면 문구 한 줄에 전 테스트가
          # 도는데, 그건 바로 위에서 경계한 그 비용이다.
          if grep -qvE '^(plan|ai|\.claude|\.github)/|^[A-Z]+\.md$|^\.(coderabbit\.yaml|gitignore|gitattributes)$' <<<"$changed" \
              || grep -qE '^plan/0[456]-' <<<"$changed" \
              || grep -qE '^\.github/(actions/setup-gradle/|workflows/(pr|_build|_test)\.yml$)' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::문서만 변경 — 빌드·테스트를 건너뛴다"
          fi

  # ── 2단계: 규범 (코드 유무와 무관하게 항상) ────────────────────────────────
  conventions:
    name: 규범
    uses: ./.github/workflows/_verify-conventions.yml
    with:
      check-commits: true
      require-journal: true

  # ── 3단계: 빌드·테스트 (코드가 바뀌었을 때만) ──────────────────────────────
  build:
    name: 빌드
    needs: context
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml
    # 부하 잡이 이 산출물을 받아 컨테이너에 넣는다. 안 올리면 그쪽이 JAR 를
    # 못 찾아 이미지 빌드에서 죽는다.
    with:
      upload-artifact: true

  test-unit:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: unit
      timeout-minutes: 15

  test-integration:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: integration
      timeout-minutes: 25

  test-context:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: context
      timeout-minutes: 15

  # 카오스는 PR 에서도 돈다 — 회복력이 이 프로젝트의 무게중심이라
  # 병합 후에 발견하면 늦다 (plan/08-resilience.md)
  test-chaos:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: chaos
      timeout-minutes: 40

  # 어댑터 커버리지는 단위·통합 exec 를 합쳐야 잴 수 있다. 계층 잡은
  # 각자 자기 exec 만 남기므로 여기서 둘을 함께 돌린다.
  test-coverage:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: coverage
      timeout-minutes: 25

  # ── 4단계: 보안 ────────────────────────────────────────────────────────────
  # 시크릿 검사는 항상 돈다 — 문서에도 토큰을 커밋할 수 있다.
  # CVE 스캔만 코드가 바뀌었을 때로 좁힌다.
  security:
    name: 보안
    needs: context
    uses: ./.github/workflows/_security.yml
    with:
      mode: pr
      severity: 'CRITICAL,HIGH'
      cve: ${{ needs.context.outputs.code == 'true' }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  # ── 5단계: 스모크 부하 ─────────────────────────────────────────────────────
  load-smoke:
    name: 부하
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_load-test.yml
    with:
      scenario: smoke
      timeout-minutes: 15

  # ── 6단계: 결과 집계 → Jira 전이 + Slack ───────────────────────────────────
  # 취소를 통과로 세지 않기 위해 별도 잡으로 뺐다. 규칙은 verdict 액션에 있다.
  verdict:
    name: 판정
    needs: [context, conventions, build, test-unit, test-integration, test-context, test-chaos, test-coverage, security, load-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.v.outputs.status }}
      ok: ${{ steps.v.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: v
        uses: ./.github/actions/verdict
        with:
          results: ${{ join(needs.*.result, ' ') }}

  report:
    name: 리포트
    needs: [context, conventions, build, test-unit, test-integration, test-context, test-chaos, test-coverage, security, load-smoke, verdict]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_report.yml
    with:
      status: ${{ needs.verdict.outputs.status || 'failure' }}
      title: >-
        PR #${{ github.event.pull_request.number }} —
        ${{ needs.verdict.outputs.ok == 'true' && 'CI 통과' || 'CI 실패' }}
      summary: |
        *${{ github.event.pull_request.title }}*
        `${{ github.head_ref }}` → `${{ github.base_ref }}`
      fields: |
        빌드=${{ needs.build.result }}
        규범=${{ needs.conventions.result }}
        단위=${{ needs.test-unit.result }}
        통합=${{ needs.test-integration.result }}
        카오스=${{ needs.test-chaos.result }}
        커버리지=${{ needs.test-coverage.result }}
        보안=${{ needs.security.result }}
        부하=${{ needs.load-smoke.result }}
      link-url: ${{ github.event.pull_request.html_url }}
      jira-key: ${{ needs.context.outputs.jira-key }}
      jira-transition: ${{ needs.verdict.outputs.ok == 'true' && '검토 중' || '' }}
      jira-comment: >-
        CI ${{ needs.verdict.outputs.ok == 'true' && '통과' || '실패' }} —
        PR #${{ github.event.pull_request.number }}
        ${{ github.event.pull_request.html_url }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ATLASSIAN_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
      ATLASSIAN_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
      CONFLUENCE_PARENT_ID: ${{ secrets.CONFLUENCE_PARENT_ID }}
