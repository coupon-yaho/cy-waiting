# 더미 응답 LB. **LB 자체의 한계만 잰다** — 뒤에 아무것도 없어 여기서 나는 천장은 LB 나 생성기의 것이다.
#
# 워커 수는 compose 의 코어 한도와 맞춘다. auto 는 호스트 코어를 세어 한도보다 많은 워커가 코어를 다툰다.
worker_processes 2;
# **파일 한도를 연결 수만큼 올린다.** 기본 1024 면 VU 가 2,400 인 칸에서 accept 가 실패하고, 못 받은 연결의 요청이
# 회차 끝까지 걸려 유입률이 절반으로 찍혔다.
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_requests 1000000;

    server {
        listen 8070;

        location = /lb/health {
            return 200 "ok\n";
        }

        # 게이트웨이 경로와 같은 모양으로 받는다. 메서드마다 다르게 굴면 기준선이 다른 일을 잰다.
        location / {
            return 200 "{\"data\":{\"status\":\"PASS\"}}\n";
        }
    }
}
