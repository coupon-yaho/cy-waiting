name: PR

# PR 을 열거나 갱신할 때. **빠른 피드백**이 목적이다.
# 무거운 것(뮤테이션·카오스·대형 부하)은 main·nightly 로 미룬다.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다.
# 취소하지 않으면 러너가 낡은 커밋을 검사하느라 큐가 막힌다.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1단계: 무엇이 바뀌었나 · 어느 Jira 이슈인가 ────────────────────────────
  context:
    name: 컨텍스트
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jira-key: ${{ steps.jira.outputs.key }}
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # PR 의 첫 관문이라 외부 액션에 의존하지 않는다 — 그 저장소가 깨지면
      # 모든 PR 이 여기서 막힌다.
      - name: 코드 변경 감지
        id: jira
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          if ! grep -qE '^(feature|bugfix|hotfix|release)/CY-[0-9]+-[a-z0-9-]+$' <<<"$BRANCH"; then
            echo "::error title=WF-3::브랜치명이 규칙에 맞지 않는다: '$BRANCH'"
            echo "::error::형식: <feature|bugfix|hotfix|release>/CY-<번호>-<영문-kebab-슬러그>"
            exit 1
          fi
          key=$(grep -oE 'CY-[0-9]+' <<<"$BRANCH" | head -1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "::notice title=Jira::$key"

      - name: 코드 변경 감지
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          changed=$(git diff --name-only "$BASE..$HEAD")
          # 빌드에 영향이 없는 것은 코드로 세지 않는다. 세면 설정 한 줄에
          # 전 테스트가 돈다. journal 검사의 제외 목록과 같은 범위다.
          if grep -qvE '^(plan|ai|\.claude|\.github)/|^[A-Z]+\.md$|^\.(coderabbit\.yaml|gitignore|gitattributes)$' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::문서만 변경 — 빌드·테스트를 건너뛴다"
          fi

  # ── 2단계: 규범 (코드 유무와 무관하게 항상) ────────────────────────────────
  conventions:
    name: 규범
    uses: ./.github/workflows/_verify-conventions.yml
    with:
      check-commits: true
      require-journal: true

  # ── 3단계: 빌드·테스트 (코드가 바뀌었을 때만) ──────────────────────────────
  build:
    name: 빌드
    needs: context
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_build.yml

  test-unit:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: unit
      timeout-minutes: 15

  test-integration:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: integration
      timeout-minutes: 25

  test-context:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: context
      timeout-minutes: 15

  # 카오스는 PR 에서도 돈다 — 회복력이 이 프로젝트의 무게중심이라
  # 병합 후에 발견하면 늦다 (plan/08-resilience.md)
  test-chaos:
    name: 테스트
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      layer: chaos
      timeout-minutes: 40

  # ── 4단계: 보안 ────────────────────────────────────────────────────────────
  # 시크릿 검사는 항상 돈다 — 문서에도 토큰을 커밋할 수 있다.
  # CVE 스캔만 코드가 바뀌었을 때로 좁힌다.
  security:
    name: 보안
    needs: context
    uses: ./.github/workflows/_security.yml
    with:
      mode: pr
      severity: 'CRITICAL,HIGH'
      cve: ${{ needs.context.outputs.code == 'true' }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  # ── 5단계: 스모크 부하 ─────────────────────────────────────────────────────
  load-smoke:
    name: 부하
    needs: [context, build]
    if: needs.context.outputs.code == 'true'
    uses: ./.github/workflows/_load-test.yml
    with:
      scenario: smoke
      timeout-minutes: 15

  # ── 6단계: 결과 집계 → Jira 전이 + Slack ───────────────────────────────────
  # 취소를 통과로 세지 않기 위해 별도 잡으로 뺐다. 규칙은 verdict 액션에 있다.
  verdict:
    name: 판정
    needs: [context, conventions, build, test-unit, test-integration, test-context, test-chaos, security, load-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.v.outputs.status }}
      ok: ${{ steps.v.outputs.ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: v
        uses: ./.github/actions/verdict
        with:
          results: ${{ join(needs.*.result, ' ') }}

  report:
    name: 리포트
    needs: [context, conventions, build, test-unit, test-integration, test-context, test-chaos, security, load-smoke, verdict]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_report.yml
    with:
      status: ${{ needs.verdict.outputs.status || 'failure' }}
      title: >-
        PR #${{ github.event.pull_request.number }} —
        ${{ needs.verdict.outputs.ok == 'true' && 'CI 통과' || 'CI 실패' }}
      summary: |
        *${{ github.event.pull_request.title }}*
        `${{ github.head_ref }}` → `${{ github.base_ref }}`
      fields: |
        규범=${{ needs.conventions.result }}
        단위=${{ needs.test-unit.result }}
        통합=${{ needs.test-integration.result }}
        카오스=${{ needs.test-chaos.result }}
        보안=${{ needs.security.result }}
        부하=${{ needs.load-smoke.result }}
      link-url: ${{ github.event.pull_request.html_url }}
      jira-key: ${{ needs.context.outputs.jira-key }}
      jira-transition: ${{ needs.verdict.outputs.ok == 'true' && '검토 중' || '' }}
      jira-comment: >-
        CI ${{ needs.verdict.outputs.ok == 'true' && '통과' || '실패' }} —
        PR #${{ github.event.pull_request.number }}
        ${{ github.event.pull_request.html_url }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ATLASSIAN_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
      ATLASSIAN_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
      CONFLUENCE_PARENT_ID: ${{ secrets.CONFLUENCE_PARENT_ID }}
