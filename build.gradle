plugins {
    id 'java'
    id 'jacoco'
    // 식별자가 ASCII 영문인지는 파서가 볼 일이다. 정규식으로 선언을 고르면
    // 어노테이션·수식어·줄바꿈이 조금만 달라도 새거나 무관한 것을 문다.
    id 'checkstyle'
    id 'codenarc'
    // 도메인 한정. 어댑터까지 돌리면 시간이 폭발하고, 정작 지켜야 할 곳의
    // 신호가 묻힌다 (Phase 2 Goal — 생존 ≤ 10%)
    id 'info.solidsoft.pitest' version '1.19.0'
    // 픽스처를 src/test 에 두면 다른 소스셋에서 못 쓰고,
    // 프로덕션에 두면 도달 불가 상태를 만드는 생성자가 운영 코드에 노출된다 (TS-3).
    id 'java-test-fixtures'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kafkick'
version = '0.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// **BOM 이 있으면 BOM 을 쓴다.** 손으로 박은 버전은 낡고, 낡았다는 사실이
// 드러나지 않는다. 버전은 maven-metadata.xml 로 실측한다 —
// search.maven.org 색인은 뒤처져 있어 최신을 못 알려준다.
ext {
    springCloudVersion = '2025.1.3'
    testcontainersVersion = '2.0.5'

    // **부트가 관리하는 판을 속성으로 덮는다.** 의존성을 따로 박으면 BOM 이
    // 관리하는 나머지 netty 모듈과 판이 갈린다.
    //
    // 4.2.15 의 HTTP 코덱 계열에 HIGH 6건이 있다 (CVE-2026-55831·55833·56745·
    // 56816·56819·59901). 취약점 스캔이 Java 를 하나도 안 보고 있어서
    // 드러나지 않았다 (CY-293).
    set('netty.version', '4.2.17.Final')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        // 부트 BOM 은 testcontainers 판을 관리하지 않는다. 손으로 적으면
        // 부트가 기대하는 판과 어긋나 런타임에야 드러난다.
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

// 버전을 손으로 적지 않는다 — 부트가 관리하는 판과 어긋나면 런타임에야 드러난다.

// 해당 페이즈에 도달하기 전에는 넣지 않는다.
// resilience4j·loadbalancer 를 미리 넣으면 쓰지 않는 의존성이 빌드를 무겁게 하고,
// 어느 페이즈가 무엇을 요구하는지가 흐려진다.
// **런처 판을 플랫폼 나머지와 맞춘다.** 뮤테이션 플러그인이 자기가 아는 판으로
// 런처를 끌어내린다. 나머지 플랫폼 모듈은 부트 BOM 이 관리하는 최신이라, 갈린
// 채로 돌면 실행기가 없는 메서드를 불러 **테스트가 통째로 안 뜬다** — 실패가
// 아니라 실행기 오류라 어느 시험이 깨졌는지도 안 보인다.
//
// 판을 손으로 안 적는다. BOM 이 올릴 때 여기만 뒤처지면 같은 어긋남이 반대
// 방향으로 다시 난다.
configurations.testRuntimeClasspath {
    resolutionStrategy.eachDependency { d ->
        if (d.requested.group == 'org.junit.platform'
                && d.requested.name == 'junit-platform-launcher') {
            d.useVersion dependencyManagement.importedProperties['junit-jupiter.version']
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 지표를 밖에서 긁어 갈 자리 (Phase 6.5). 판은 부트 BOM 이 관리한다.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 요청 경로는 레디스를 치지 않는다 (RD-4). 그래도 제어 평면 — 스케줄러와
    // 큐 — 은 쳐야 한다. reactive 쪽만 쓴다. Jedis 는 블로킹이라 배경 루프를
    // 멎게 한다 (RX-1).
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    // 서킷·타임아웃 (Phase 6.1·6.2). 판은 spring-cloud BOM 이 관리한다.
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 도메인 순수성은 리뷰로 못 지킨다. 한 번 깨지면 조용히 번진다.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    // 인메모리 대역으로는 Lua 의 복제 동작도 시계도 확인할 수 없다 (TS-3).
    // 이 페이즈가 지키려는 것이 정확히 그 둘이라 실물로 붙는다.
    //
    // 2.x 에서 junit-jupiter 가 testcontainers-junit-jupiter 로 바뀌었다.
    // 옛 이름으로 되돌리면 해석 자체가 안 된다.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // 리액티브 흐름은 단언할 지점이 다르다 — 무엇이 몇 번 흘렀는지,
    // 오류가 밖으로 샜는지. 판은 부트가 관리한다.
    testImplementation 'io.projectreactor:reactor-test'

    // 카오스 주입은 **회선에서** 한다. 이 시스템의 장애는 지연 상승과 커넥션
    // 단절이라 빈 단위 프록시로는 안 닿는다. 판은 테스트컨테이너 BOM 이 잡는다.
    // 2.x 에서 모듈 이름에 접두사가 붙었다. BOM 이 판을 잡는다.
    testImplementation 'org.testcontainers:testcontainers-toxiproxy'
    testFixturesImplementation 'org.testcontainers:testcontainers-toxiproxy'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 장애 주입 픽스처가 실물 컨테이너를 다룬다. **Phase 8 이 다시 만들지
    // 않고 확장하도록** 픽스처 소스셋에 둔다 (04-control-plane 6.0).
    testFixturesApi 'org.testcontainers:testcontainers'
    testFixturesApi 'io.lettuce:lettuce-core'
    // 뒷단 스텁도 픽스처다. 시나리오마다 다시 쓰면 "전 시나리오 중복 0" 같은
    // 게이트가 시나리오마다 다른 것을 재게 된다.
    testFixturesApi 'io.projectreactor.netty:reactor-netty-http'
}

// ── 테스트 계층 ──────────────────────────────────────────────────────────────
// CI 가 계층별로 나눠 돌린다 (_test.yml). 한 태스크에 다 넣으면 어느 계층이
// 왜 느린지·왜 깨졌는지가 안 보이고, 페이즈별로 켜고 끌 수도 없다.
//
// 태그로 가른다. 태그가 없는 테스트는 unit 으로 본다 — 새 테스트를 쓰면서
// 태그를 잊어도 어딘가에서는 돈다.

// docker-java 는 API 1.32 로 협상하는데 최신 데몬은 1.40 이상만 받는다. 데몬을
// 낮출 수는 없으니 클라이언트 판을 올려 준다. 이미 설정돼 있으면 그대로 둔다 —
// 사람마다 데몬 판이 다르고, 우리가 그걸 다 알 수는 없다.
tasks.withType(Test).configureEach {
    // 상한을 안 걸면 시험 JVM 이 램의 1/4 까지 잡는다. 계층이 넷이라 그것만으로
    // 장비가 넘어간다. 실측으로 가장 무거운 계층도 512m 를 안 넘는다.
    maxHeapSize = '768m'
    // 계층마다 JVM 하나만 쓴다. 늘리면 공유 레디스를 동시에 만져 시험이 갈린다.
    maxParallelForks = 1
    def apiVersion = System.getenv('DOCKER_API_VERSION') ?: '1.43'
    environment 'DOCKER_API_VERSION', apiVersion
    systemProperty 'api.version', apiVersion
    // **배경 루프가 공유 레디스를 만지면 시험끼리 간섭한다.** 리더 락과
    // 스냅샷을 직접 다루는 시험이 자기가 만든 상태를 잃고, 실패가 코드
    // 결함인지 간섭인지 못 가리게 된다. 배선을 재는 시험만 다시 켠다.
    systemProperty 'spring.profiles.active', 'test'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'context', 'chaos'
    }
    // **계획서도 시험의 입력이다.** 게이트와 시험을 잇는 표를 계획서에서 읽는
    // 시험이 있는데, 그레이들이 이 경로를 모르면 계획서만 고친 판에서 그 시험이
    // 안 돈다 — 게이트를 지워도 로컬은 초록이다.
    // **읽는 문서만 건다.** `plan/` 전체를 걸면 어느 계획서를 고쳐도 단위 시험
    // 천 개가 다시 돈다 — 저널이나 결정 문서를 고치는 흐름에서 매번 걸린다.
    inputs.files('plan/04-control-plane.md', 'plan/05-data-plane.md',
                    'plan/06-protection.md')
            .withPropertyName('gatePlans')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    finalizedBy jacocoTestReport
}

['integration', 'context', 'chaos'].each { layer ->
    tasks.register("${layer}Test", Test) {
        description = "${layer} 계층 테스트"
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags layer
        }
        // 해당 태그가 하나도 없어도 실패하지 않는다. 계층은 페이즈가
        // 진행되며 채워지고, 빈 계층 때문에 파이프라인이 막히면 안 된다.
        filter {
            failOnNoMatchingTests = false
        }
    }
}

// ── 품질 임계 ────────────────────────────────────────────────────────────────
// 임계 미달이면 build 가 실패한다. "확인했다" 는 통과가 아니다.

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // 픽스처는 커버리지 대상이 아니다. 테스트를 돕는 코드라
    // 포함시키면 본 코드의 미달을 픽스처가 덮는다.
    classDirectories.setFrom(sourceSets.main.output)
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn test
    classDirectories.setFrom(sourceSets.main.output)
    violationRules {
        // 도메인은 순수해서 100% 가 가능하다. 못 채운다는 것은
        // 도달 불가 분기가 있다는 뜻이고, 그건 설계 문제다.
        rule {
            element = 'PACKAGE'
            includes = ['com.kafkick.waiting.domain.*']
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

// 어댑터는 단위·통합 양쪽에서 덮인다. JaCoCo 는 Lua 를 못 보고 어댑터의
// Java 는 대부분 단위 시험이 도는 순수 로직이라, 통합 exec 만 보면 엉뚱한
// 것을 잰다 (AIJ-0024). 계층이 잡으로 갈려 exec 가 한자리에 안 모이므로
// 두 exec 를 합쳐 어댑터만 따로 잰다.
//
// **보고 대상도 어댑터로 좁힌다.** main 전체를 넣으면 도메인과 부트 클래스가
// 섞여 들어가 "어댑터 보고서" 라는 이름이 거짓이 된다.
def adapterClasses = { ->
    sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'com/kafkick/waiting/adapter/redis/**'
    }
}

tasks.register('adapterCoverageReport', JacocoReport) {
    description = '어댑터 커버리지 보고 — 단위·통합 결합 기준'
    group = 'verification'
    dependsOn test, integrationTest
    executionData test, integrationTest
    sourceDirectories.setFrom(sourceSets.main.java.sourceDirectories)
    classDirectories.setFrom(adapterClasses())
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('adapterCoverageVerification', JacocoCoverageVerification) {
    description = '어댑터 커버리지 임계 — 단위·통합 결합 기준'
    group = 'verification'
    dependsOn test, integrationTest
    executionData test, integrationTest
    sourceDirectories.setFrom(sourceSets.main.java.sourceDirectories)
    classDirectories.setFrom(adapterClasses())
    // **못 넘겼을 때가 보고서가 가장 필요한 때다.** finalizer 로 걸지 않으면
    // 실패한 실행에서만 보고서가 없어 어디가 빈지 볼 수 없다.
    finalizedBy 'adapterCoverageReport'
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.kafkick.waiting.adapter.redis']
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

// 게이트웨이 배선은 단위와 컨텍스트 양쪽에서 덮인다. 필터 순서와 CORS 는
// 컨텍스트에서만 도는데, 단위 exec 만 보면 그 부분이 통째로 안 덮인 것으로
// 잡힌다. 도메인의 100% 규칙을 이 패키지에 그대로 걸 수는 없다 — 프레임워크
// 계약상 안 도는 방어 분기가 남아 있어서다 (G5.10 각주).
def gatewayClasses = { ->
    sourceSets.main.output.classesDirs.asFileTree.matching {
        include 'com/kafkick/waiting/gateway/**'
    }
}

tasks.register('gatewayCoverageReport', JacocoReport) {
    description = '게이트웨이 커버리지 보고 — 단위·컨텍스트 결합 기준'
    group = 'verification'
    dependsOn test, contextTest
    executionData test, contextTest
    sourceDirectories.setFrom(sourceSets.main.java.sourceDirectories)
    classDirectories.setFrom(gatewayClasses())
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('gatewayCoverageVerification', JacocoCoverageVerification) {
    description = '게이트웨이 커버리지 임계 — 단위·컨텍스트 결합 기준'
    group = 'verification'
    dependsOn test, contextTest
    executionData test, contextTest
    sourceDirectories.setFrom(sourceSets.main.java.sourceDirectories)
    classDirectories.setFrom(gatewayClasses())
    finalizedBy 'gatewayCoverageReport'
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.kafkick.waiting.gateway']
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification, 'gatewayCoverageVerification'
}

// 픽스처가 프로덕션 아티팩트에 새면 도달 불가 상태를 만드는 생성자가
// 운영 코드에 노출된다 (TS-3). 사람 눈으로 보지 않고 빌드가 잡는다.
tasks.register('verifyFixturesExcluded') {
    dependsOn tasks.named('bootJar')
    doLast {
        def jar = tasks.named('bootJar').get().archiveFile.get().asFile
        def leaked = new java.util.zip.ZipFile(jar).entries().toList()
                .findAll { it.name.contains('testFixtures') || it.name.endsWith('Fixtures.class') }
        if (leaked) {
            throw new GradleException("픽스처가 프로덕션 JAR 에 포함됐다: ${leaked*.name}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyFixturesExcluded'
}

pitest {
    // **control 도 넣는다.** 제어 평면의 순수 계산(분모·가용량)이 여기 있는데
    // 범위 밖이라 생존 뮤턴트가 CI 에서 안 잡혔다. 어댑터는 여전히 뺀다 —
    // 시간이 폭발하고 정작 지켜야 할 곳의 신호가 묻힌다.
    //
    // **gateway 의 판정 코드도 넣는다.** 응답 봉투·재시도 안내처럼 값을 정하는
    // 코드가 여기 있는데, 범위 밖이라 약한 단언이 숫자에 안 잡혔다.
    targetClasses = ['com.kafkick.waiting.domain.*', 'com.kafkick.waiting.control.*',
                     'com.kafkick.waiting.gateway.*']
    // domain 은 Phase 2 에서 채워진다. 그전까지 대상이 0건인데, 이걸 실패로
    // 두면 파이프라인이 페이즈 진행을 막는다. 클래스가 들어오면 임계가 문다.
    failWhenNoMutations = false
    // **배선은 대상이 아니다.** 조립만 하는 코드라 뮤턴트가 대부분 등가이고,
    // 실제로 지켜야 할 것(빈이 뜨는가·이름이 그룹과 맞는가)은 컨텍스트 시험이
    // 본다. 여기 두면 숫자만 흐려진다.
    //
    // **한 줄로 모은다.** 나눠 쓰면 뒤엣것이 앞엣것을 덮어, 뺀 줄 알았던 것이
    // 조용히 다시 들어온다.
    excludedClasses = [
            'com.kafkick.waiting.*Application*',
            'com.kafkick.waiting.control.*Config',
            'com.kafkick.waiting.adapter.*.*Config',
            'com.kafkick.waiting.gateway.*Config',
            'com.kafkick.waiting.gateway.GatewayRoutes*',
            'com.kafkick.waiting.gateway.CorsPolicy*',
            'com.kafkick.waiting.gateway.ConfigUris*',
            'com.kafkick.waiting.gateway.FilterOrder',
    ]
    mutationThreshold = 90          // 생존 ≤ 10%
    timestampedReports = false
    // XML 이 있어야 생존 뮤턴트를 기계로 짚는다. HTML 만 두면 사람이 눈으로 센다.
    outputFormats = ['HTML', 'XML']
    // **코어와 플러그인을 함께 본다.** junit5-plugin 은 PIT 을 provided 로
    // 잡아서, 코어가 뒤처져도 조용히 돌다가 엉뚱한 데서 깨진다.
    // 1.25.9 는 1.15.0 보다 뮤턴트를 44개 더 만든다 (285 → 329, 실측).
    pitestVersion = '1.25.9'
    junit5PluginVersion = '1.2.3'
    // **시한을 스프링 판에 맞춘다.** 기본 4초는 단위 시험 기준이라, 컨텍스트를
    // 띄우는 시험(느린 것이 6.3초)이 그 안에 못 끝난다. 그러면 미니언이 시간
    // 초과로 죽고 그 판의 뮤턴트가 통째로 유실된다 — main 파이프라인에서
    // `Minion exited abnormally due to TIMED_OUT` 이 열네 번 났다.
    //
    // **그 시험들을 빼는 쪽은 안 골랐다.** 빼 보니 뮤테이션이 91%에서 85%로
    // 떨어졌다 — 실제로 뮤턴트를 죽이고 있었다. 느리다고 빼면 게이트가 지키던
    // 것을 잃는다.
    //
    // **시간 초과가 몇 건 나는 것은 정상이다.** 미니언마다 별도 JVM 이라
    // 컨테이너를 띄우는 시험이 그 안에서 다시 뜨고, 그것만으로 수십 초가 간다.
    // 45000 으로 올려 봐도 여섯 건이 그대로 났다 (실측). 시한으로 없앨 수 있는
    // 종류가 아니라서 되돌렸다.
    //
    // 그리고 그것은 유실이 아니다. PIT 는 시간을 넘긴 뮤턴트를 TIMED_OUT 으로
    // 기록하고 죽인 것으로 센다 — 2109 개를 만들어 2109 개가 리포트에 남았고
    // KILLED 1891 + TIMED_OUT 6 이 요약의 1897 과 정확히 맞았다.
    //
    // 20000 은 **상수**다. PIT 의 실효 시한은 이 값에 `timeoutFactor × 기준
    // 시간` 이 더해진 것이라, "가장 느린 시험의 세 배" 같은 셈으로 읽으면
    // 안 된다. 늘리면 무한 루프 뮤턴트의 판정도 그만큼 늦어져 전체 실행이
    // 길어진다 — 20000 에서 실측 14분, 45000 에서 24분이다. 잡 상한 40분은
    // 앞엣값 위에 잡은 것이라, 이 상수를 만지면 상한도 같이 본다.
    timeoutConstInMillis = 20000
    // 미니언이 코어 수만큼 뜨면 그것만으로 장비가 넘어간다. 상한을 건다.
    threads = 2
    // **시험 태스크와 같은 프로파일을 준다.** 안 주면 컨텍스트 시험이 운영
    // 설정으로 떠서 통째로 실패하고, PIT 은 "초록이 아니다" 라며 멎는다 —
    // 실패 원인이 배선인지 뮤턴트인지 안 보인다.
    jvmArgs = ['-Xmx768m', '-Dspring.profiles.active=test']
}

// ── 식별자 규칙 ────────────────────────────────────────────────────────────
checkstyle {
    toolVersion = '14.0.0'
    // 위반이 있으면 빌드를 세운다. 보고만 하면 아무도 안 본다.
    ignoreFailures = false
    maxWarnings = 0
}

// 시험은 타입 이름만 본다. 시험 메서드 이름과 헬퍼는 한글 문장이라야 무엇을
// 보장하는지 읽힌다 — 경계는 파일이 아니라 선언 종류다.
tasks.named('checkstyleTest') {
    configFile = file('config/checkstyle/checkstyle-test.xml')
}
tasks.named('checkstyleTestFixtures') {
    configFile = file('config/checkstyle/checkstyle-test.xml')
}

codenarc {
    toolVersion = '4.0.0'
    configFile = file('config/codenarc/codenarc.groovy')
    ignoreFailures = false
}

// **빌드 스크립트는 소스셋에 없다.** 그래서 따로 태스크를 만들어 태운다 —
// 안 태우면 build.gradle 이 어떤 검사도 안 보는 상태로 남는다.
tasks.register('codenarcBuildScripts', org.gradle.api.plugins.quality.CodeNarc) {
    description = '빌드 스크립트 식별자 검사'
    group = 'verification'
    source = fileTree(projectDir) {
        include '*.gradle'
        include 'gradle/**/*.gradle'
    }
    compilationClasspath = files()
}
tasks.named('check') { dependsOn 'codenarcBuildScripts' }

/**
 * 생존 신호 수명을 부하 하네스에 알려 준다.
 *
 * <b>손으로 옮겨 적지 않게 한다.</b> G7.5 판정이 이 값에 걸려 있는데, 사본을
 * 두면 정책이 움직일 때 판정만 옛 값을 쓴다 — 실제로 그 상수 하나가 같은
 * 측정에서 통과와 미달을 뒤집었다.
 *
 * <b>도메인에 main 을 두지 않는다.</b> 부하 하네스 편의를 위해 프로덕션
 * 클래스에 진입점을 만들면 그 자리가 계속 는다. 컴파일된 것을 읽는다.
 */
tasks.register('printAliveTtlSeconds') {
    description = '생존 신호 수명(초). test/load/abandonment-waste.sh 가 읽는다'
    group = 'verification'
    dependsOn 'classes'
    ext.policy = 'com.kafkick.waiting.domain.queue.PollIntervalPolicy'
    doLast {
        def urls = sourceSets.main.runtimeClasspath.collect { it.toURI().toURL() }
        new URLClassLoader(urls as URL[]).withCloseable { loader ->
            def seconds = loader.loadClass(policy).getMethod('aliveTtl').invoke(null).toSeconds()
            println seconds
        }
    }
}
