# 기준선의 origin. 게이트웨이 자리에 서서 고정 200 만 낸다 — 여기서 드는 시간이 기준선에 남고 뺄 때 사라진다.
worker_processes 2;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_requests 1000000;

    server {
        listen 8071;

        location = /origin/health {
            return 200 "ok\n";
        }

        # 게이트웨이 경로와 같은 모양으로 받는다. 메서드마다 다르게 굴면 기준선이 다른 일을 잰다.
        location / {
            return 200 "{\"data\":{\"status\":\"PASS\"}}\n";
        }
    }
}
