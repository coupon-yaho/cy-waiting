# 레디스를 전용 코어에 고정한다.
#
# **잰 값이 오염돼 있었다.** 착수 판정 회차의 `evalsha` 가 45.5μs 였는데,
# 게이트웨이·뒷단과 CPU 를 나눠 쓴 호스트에서 나온 값이다. 격리해서 같은
# 스크립트를 재니 32μs 였다 — 30% 가 경합 몫이다. 그 값 위에 "코어 하나
# 천장" 을 세우면 착수가 실제보다 가까워 보인다.
#
# **겹침으로 둔다.** 기존 회차의 조건을 바꾸지 않는다 — 지금까지 잰 값들과
# 견주려면 그쪽은 그대로여야 한다.
#
#   사용: docker compose -f compose.yml -f compose.pinned.yml up -d
services:
  redis:
    cpuset: "0"
  # **나머지는 안 묶는다.** 레디스가 쓰는 코어만 비워 두면 되고, 나머지를
  # 좁히면 게이트웨이가 병목이 된다 — 실제로 그렇게 묶었더니 응답 중앙값이
  # 7.2 초가 되고 fail-open 이 스물다섯 번 찍혔다. 그때 레디스는 CPU 8.9% 로
  # 한가했다. **재려던 것은 레디스인데 게이트웨이를 재게 된다.**
  #
  # 부하 생성기(k6)는 호스트에서 돌고 이 파일이 안 묶으므로, 레디스가 쓰는
  # 코어와 겹칠 수 있다. 그것까지 막으려면 `taskset` 으로 k6 를 따로 묶는다.
  gateway:
    cpuset: "1-11"
