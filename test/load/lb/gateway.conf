# 게이트웨이들 앞의 LB. 기준선(`dummy.conf`)과 워커·연결 설정을 맞춰야 두 값을 뺄 수 있다.
worker_processes 2;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_requests 1000000;

    # `--scale` 로 뜬 대들을 컨테이너 DNS 가 모두 돌려준다. 뜬 뒤에 설정을 읽어야 해서 compose 가 게이트웨이의
    # 준비를 기다린다.
    upstream gateways {
        server gateway:8080;
        # 초당 수천 건을 새 연결로 받으면 임시 포트가 먼저 마른다.
        keepalive 512;
    }

    server {
        listen 8070;

        location = /lb/health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # **실패를 다른 대로 되보내지 않는다.** 되보내면 게이트웨이가 낸 오류가 LB 에서 가려져 판정 밖 응답이
            # 안 보인다. 전달 헤더는 k6 가 붙인 그대로 넘긴다 — 직접 치는 회차와 같은 주소 몫을 만든다.
            proxy_next_upstream off;
        }
    }
}
