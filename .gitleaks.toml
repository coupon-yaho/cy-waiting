# gitleaks 설정.
#
# **기본 규칙을 그대로 쓴다.** 우리가 규칙을 다시 쓰면 도구가 갱신될 때
# 새로 늘어난 탐지가 안 들어온다.
[extend]
useDefault = true

[allowlist]
description = "시험 픽스처와 빌드 산출물"

# **파일을 통째로 열지 않는다.** 그러면 나중에 그 파일에 들어온 진짜 키도
# 같이 지나간다. 값 자체에 표식을 넣고 그 표식이 든 값만 허용한다.
regexes = ['''not-a-real-secret''']
regexTarget = "match"

# **경로 예외를 안 둔다.** 빌드 산출물이 걸리는 것은 로컬에서만 생기는 일이고,
# 그 편의를 위해 경로를 열면 강제로 커밋된 산출물 안의 진짜 키까지 지나간다.
# 로컬에서는 --no-git 대신 커밋 범위로 돌리면 산출물이 대상에 안 들어온다.
