name: Verdict
description: 잡 결과 목록을 하나의 통과·실패로 판정한다

# `contains(needs.*.result, 'failure')` 만 보면 취소가 통과로 집계되어
# Jira 가 다음 상태로 넘어간다. 규칙을 한 곳에 두고 세 워크플로가 같이 쓴다.

inputs:
  results:
    description: "join(needs.*.result, ' ') 결과"
    required: true

outputs:
  status:
    description: success | failure
    value: ${{ steps.judge.outputs.status }}
  ok:
    description: 'true | false'
    value: ${{ steps.judge.outputs.ok }}

runs:
  using: composite
  steps:
    - name: 통과·실패 판정
      id: judge
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: |
        set -uo pipefail

        # skipped 는 통과로 본다 — 문서 PR 에서 빌드·테스트를 건너뛰는 것은 정상이다.
        # failure 와 cancelled 는 통과가 아니다. 취소는 "검사하지 않았다"는 뜻이지
        # "이상 없다"가 아니다.
        if grep -qE '(^| )(failure|cancelled)( |$)' <<<"$RESULTS"; then
          echo "status=failure" >> "$GITHUB_OUTPUT"
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=판정::실패 — $RESULTS"
        else
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=판정::통과 — $RESULTS"
        fi
