// 의존성 잠금을 **이 호출에만** 켠다.
//
// build.gradle 에 넣으면 스캔 사정이 일반 빌드에 얹힌다 — 락파일이 한 번
// 생기면 그 뒤 모든 빌드가 그것과 대조하게 되고, 개발자가 의존성을 바꿀 때마다
// 잠금 갱신을 강요당한다. 취약점 스캔 때문에 빌드가 무거워지면 안 된다.
//
// 락파일은 커밋하지 않는다. Trivy 가 Gradle 을 락파일로만 읽어서 만드는 것이지
// 잠금 자체가 목적이 아니다 (CY-293).
allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }
}
