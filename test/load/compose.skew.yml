# 게이트웨이 여러 대의 쏠림을 재는 겹침 (9.4.5 · R-4).
#
# **P2C 를 고른 원래 이유가 여기 있다.** 최소값을 그냥 고르면 게이트웨이 M 대가
# 같은 인스턴스로 몰린다 — 각자 제 누적을 들고 같은 여유를 보므로 같은 순서를
# 내고, 그놈이 순식간에 가장 바쁜 놈이 되어 다 같이 다음으로 옮겨 간다. 한 대
# 짜리 하네스는 그 성질을 원리적으로 못 잰다: 누적이 하나뿐이라 어긋날 상대가
# 없다. 기본 전략을 뒤집는 조건이 이 실측인 것도 그래서다.
#
# **서비스를 새로 안 만든다.** 같은 정의를 두 벌 적으면 한쪽만 고치는 날이 오고,
# 그때 두 게이트웨이가 다른 설정으로 도는데 배너는 같다고 찍는다. 포트만 범위로
# 열어 `--scale gateway=2` 로 늘린다.
services:
  gateway:
    ports: !override
      - "18080-18089:8080"

  # **표본을 밖에서 읽는다.** 순간 점유를 재려면 초당 몇 번씩 세 대를 봐야 하는데,
  # 컨테이너로 들어가 읽으면 그 왕복이 곧 표본 간격이 된다 — 재려는 것보다 자가
  # 굵어진다. 큰 대는 기본 겹침이 이미 열어 두었다.
  backend-small:
    ports:
      - "18091:8090"
  backend-mid:
    ports:
      - "18092:8090"
