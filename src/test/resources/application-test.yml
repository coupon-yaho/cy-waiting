# **시험에서는 제어 평면 루프를 끈다.**
#
# 켜 두면 배경 루프가 공유 레디스의 리더 락과 스냅샷을 계속 만진다. 그러면
# 그 키를 직접 다루는 시험이 자기가 만든 상태를 잃고, 부하에 따라 결과가
# 갈리는 시험이 된다 — 실패가 코드 결함인지 간섭인지 못 가린다.
#
# **덧씌우는 파일이라 운영 설정을 안 가린다.** 이름 없는 파일로 두면 레디스
# 시간 예산까지 통째로 사라져 기동이 막힌다.
#
# 배선 자체를 재는 시험은 이 값을 다시 덮어써서 확인한다.
waiting:
  scheduler:
    enabled: false
